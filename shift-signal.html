/* ── 17 · ROWS · one flat record per completed run ─────────────────  */
function rowFromRun(r) {
  const sc = r.scores && r.scores.simDims ? r.scores : computeScores(r);
  const pts = r.points || dataPoints(r);
  return {
    id: r.id, code: r.code || '—', programme: r.programme || '—', testRun: !!r.testRun,
    bio: r.bio || {}, completedAt: r.completedAt || r.createdAt,
    sim: sc.sim, q12: sc.q12, sim100: sc.sim100, q12100: sc.q12100, delta: sc.delta,
    simDims: sc.simDims, q12Dims: sc.q12Dims,
    anchor: sc.anchor, anchor5: sc.anchor == null ? null : 1 + (sc.anchor / 10) * 4,
    q0: sc.q0, simSecs: sc.simSecs, q12Secs: sc.q12Secs,
    revisions: sc.revisions, medianLatency: sc.medianLatency, trace: sc.trace,
    pointsA: pts.a, pointsB: pts.b,
    exp: r.exp || { sim: {}, q12: {} },
    stay: r.a.stay, recommend: r.a.recommend,
    incident: r.a.incident || '', probeQ: r.a.probeQ || '', probeA: r.a.probeA || '',
    answers: r.a.answers, q12Raw: r.b.scores
  };
}
const progShort = p => p.includes('HRM') ? 'HRM' : p.includes('Analytics') ? 'BA' : p.includes('Core') ? 'Core' : '—';

/* ── 18 · VISUALS ──────────────────────────────────────────────────
   Shared conventions: recessive grid, thin marks, 2px surface gaps
   between adjacent bars, direct value labels, all text in ink tokens
   so colour never carries meaning alone, hover tooltips everywhere,
   and a table view of every figure below in the data tab.            */
const AX = { min: 1, max: 5 };
const legendAB = `<div class="legend">
  <span class="lg"><span class="sw a"></span>Mode A · simulation</span>
  <span class="lg"><span class="sw b"></span>Mode B · Gallup Q12</span></div>`;

function yGrid(x0, x1, y, label) {
  return `<g><line x1="${x0}" y1="${y}" x2="${x1}" y2="${y}" stroke="var(--grid)" stroke-width="1"/>
    <text x="${x0 - 8}" y="${y + 3.5}" font-size="10" fill="var(--ink-3)" text-anchor="end">${label}</text></g>`;
}

/* V1 · paired slope chart — does each mode place the same person at the same level? */
function chartPaired(all) {
  const rows = all.filter(r => r.sim != null && r.q12 != null);
  if (!rows.length) return emptyFig('No paired observations yet.');
  const W = 640, H = 310, L = 34, R = 18, T = 30, B = 52;
  const y = v => T + (1 - (v - AX.min) / (AX.max - AX.min)) * (H - T - B);
  const step = (W - L - R) / rows.length;
  const cx = i => L + step * (i + 0.5);
  const grid = [1, 2, 3, 4, 5].map(v => yGrid(L, W - R, y(v), v.toFixed(0))).join('');
  const marks = rows.map((r, i) => {
    const x = cx(i), ya = y(r.sim), yb = y(r.q12);
    const dl = r.delta == null ? '—' : (r.delta > 0 ? '+' : '') + r2(r.delta);
    const flip = ya < yb;
    return `<g>
      <line x1="${x}" y1="${ya}" x2="${x}" y2="${yb}" stroke="var(--rule-2)" stroke-width="2" stroke-linecap="round"/>
      <circle cx="${x}" cy="${ya}" r="6" fill="var(--a)" stroke="var(--surface)" stroke-width="2"
        data-tip="<b>${esc(r.code)} · Mode A</b><br>Simulation index ${r2(r.sim)} / 5<br>${r0(r.sim100)} / 100"/>
      <circle cx="${x}" cy="${yb}" r="6" fill="var(--b)" stroke="var(--surface)" stroke-width="2"
        data-tip="<b>${esc(r.code)} · Mode B</b><br>Q12 index ${r2(r.q12)} / 5<br>${r0(r.q12100)} / 100"/>
      <text x="${x + 12}" y="${ya + 3.5}" font-size="10.5" fill="var(--ink)">${r2(r.sim)}</text>
      <text x="${x + 12}" y="${yb + 3.5}" font-size="10.5" fill="var(--ink)">${r2(r.q12)}</text>
      <text x="${x}" y="${H - B + 18}" font-size="11" fill="var(--ink)" text-anchor="middle">${esc(r.code)}</text>
      <text x="${x}" y="${H - B + 32}" font-size="9.5" fill="var(--ink-3)" text-anchor="middle">${esc(progShort(r.programme))}</text>
      <text x="${x}" y="${H - B + 46}" font-size="9.5" fill="var(--ink-2)" text-anchor="middle">Δ ${dl}</text>
    </g>`;
  }).join('');
  return `<figure>${legendAB}
    <svg class="viz" viewBox="0 0 ${W} ${H}" role="img"
      aria-label="Paired engagement index per respondent, simulation against Q12, on a 1 to 5 scale">
      ${grid}
      <line x1="${L}" y1="${y(3)}" x2="${W - R}" y2="${y(3)}" stroke="var(--dash)" stroke-width="1" stroke-dasharray="4 4"/>
      <text x="${W - R}" y="${y(3) - 6}" font-size="9.5" fill="var(--ink-3)" text-anchor="end">scale midpoint</text>
      ${marks}
      <text x="${L - 8}" y="${T - 14}" font-size="9.5" fill="var(--ink-3)" text-anchor="start">index, 1–5</text>
    </svg></figure>`;
}

/* V2 · dimension profile — grouped horizontal bars, both modes */
function chartDims(rows) {
  if (!rows.length) return emptyFig('No dimension data yet.');
  const W = 640, L = 148, R = 54, T = 10, rowH = 44, barH = 13;
  const H = T + DIMS.length * rowH + 26;
  const x = v => L + ((v - AX.min) / (AX.max - AX.min)) * (W - L - R);
  const vgrid = [1, 2, 3, 4, 5].map(v =>
    `<line x1="${x(v)}" y1="${T}" x2="${x(v)}" y2="${T + DIMS.length * rowH - 8}" stroke="var(--grid)" stroke-width="1"/>
     <text x="${x(v)}" y="${H - 8}" font-size="10" fill="var(--ink-3)" text-anchor="middle">${v}</text>`).join('');
  const bars = DIMS.map((d, i) => {
    const a = mean(rows.map(r => r.simDims[d.id]).filter(v => v != null));
    const b = mean(rows.map(r => r.q12Dims[d.id]).filter(v => v != null));
    const top = T + i * rowH + 4;
    const bar = (v, cls, yy, tipLabel) => v == null ? '' :
      `<rect x="${x(AX.min)}" y="${yy}" width="${Math.max(1, x(v) - x(AX.min))}" height="${barH}" rx="3"
         fill="var(--${cls})" data-tip="<b>${esc(d.name)}</b><br>${tipLabel} ${r2(v)} / 5${v == null ? '' : ' · ' + r0(pct100(v)) + '/100'}"/>
       <text x="${x(v) + 7}" y="${yy + barH - 3}" font-size="10.5" fill="var(--ink)">${r2(v)}</text>`;
    return `<g>
      <text x="${L - 10}" y="${top + 11}" font-size="10.5" fill="var(--ink)" text-anchor="end">${d.k} · ${esc(d.name.split(' & ')[0])}</text>
      <text x="${L - 10}" y="${top + 24}" font-size="9" fill="var(--ink-3)" text-anchor="end">${d.q12.map(n => 'Q' + n).join(' ')}</text>
      ${bar(a, 'a', top, 'Simulation')}
      ${bar(b, 'b', top + barH + 2, 'Q12')}
    </g>`;
  }).join('');
  return `<figure>${legendAB}
    <svg class="viz" viewBox="0 0 ${W} ${H}" role="img"
      aria-label="Mean score per engagement dimension, simulation against Q12">
      ${vgrid}${bars}
      <line x1="${x(AX.min)}" y1="${T}" x2="${x(AX.min)}" y2="${T + DIMS.length * rowH - 8}" stroke="var(--rule-2)" stroke-width="1"/>
    </svg></figure>`;
}

/* V3 · difference chart — signed gap between the modes, with mean bias */
function chartDelta(rows) {
  const ds = rows.map(r => r.delta).filter(v => v != null);
  if (!ds.length) return emptyFig('No differences to plot yet.');
  const W = 640, H = 280, L = 40, R = 58, T = 20, B = 46;
  const lim = Math.max(0.6, Math.max(...ds.map(Math.abs)) * 1.35);
  const y = v => T + (1 - (v + lim) / (2 * lim)) * (H - T - B);
  const step = (W - L - R) / rows.length;
  const bw = Math.min(46, step * 0.42);
  const bias = mean(ds), s = sd(ds);
  const ticks = [-lim, -lim / 2, 0, lim / 2, lim].map(v =>
    yGrid(L, W - R, y(v), (v > 0 ? '+' : '') + r1(v))).join('');
  const bars = rows.map((r, i) => {
    if (r.delta == null) return '';
    const x = L + step * (i + 0.5) - bw / 2;
    const up = r.delta >= 0;
    const h = Math.max(1.5, Math.abs(y(r.delta) - y(0)));
    return `<g>
      <rect x="${x}" y="${up ? y(r.delta) : y(0)}" width="${bw}" height="${h}" rx="3"
        fill="var(--${up ? 'a' : 'b'})"
        data-tip="<b>${esc(r.code)}</b><br>Simulation ${r2(r.sim)} · Q12 ${r2(r.q12)}<br>${up ? 'Simulation read higher' : 'Q12 read higher'} by ${r2(Math.abs(r.delta))}"/>
      <text x="${x + bw / 2}" y="${up ? y(r.delta) - 7 : y(r.delta) + 14}" font-size="10.5" fill="var(--ink)" text-anchor="middle">${(r.delta > 0 ? '+' : '') + r2(r.delta)}</text>
      <text x="${x + bw / 2}" y="${H - B + 20}" font-size="11" fill="var(--ink)" text-anchor="middle">${esc(r.code)}</text>
      <text x="${x + bw / 2}" y="${H - B + 33}" font-size="9.5" fill="var(--ink-3)" text-anchor="middle">${esc(progShort(r.programme))}</text>
    </g>`;
  }).join('');
  return `<figure>
    <div class="legend">
      <span class="lg"><span class="sw a"></span>Simulation read higher</span>
      <span class="lg"><span class="sw b"></span>Q12 read higher</span>
    </div>
    <svg class="viz" viewBox="0 0 ${W} ${H}" role="img"
      aria-label="Difference between simulation and Q12 index per respondent, with the mean difference marked">
      ${ticks}${bars}
      <line x1="${L}" y1="${y(0)}" x2="${W - R}" y2="${y(0)}" stroke="var(--ink-3)" stroke-width="1.5"/>
      <line x1="${L}" y1="${y(bias)}" x2="${W - R}" y2="${y(bias)}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="5 4"/>
      <text x="${W - R + 5}" y="${y(bias) + 3.5}" font-size="9.5" fill="var(--ink)">mean</text>
      <text x="${W - R + 5}" y="${y(bias) + 15}" font-size="9.5" fill="var(--ink-2)">${(bias > 0 ? '+' : '') + r2(bias)}</text>
      <text x="${L}" y="${T - 6}" font-size="9.5" fill="var(--ink-3)">index points, Mode A − Mode B</text>
    </svg>
    <p class="p-note">Mean difference <span class="mono">${(bias > 0 ? '+' : '') + r2(bias)}</span>
      index points${s == null ? '' : `, SD <span class="mono">${r2(s)}</span>`}.
      With ${rows.length} paired observation${rows.length === 1 ? '' : 's'} this describes the sample; it does not
      establish agreement limits, which need a far larger n.</p>
  </figure>`;
}

/* V4 · convergent validity — one series of paired points against identity */
function chartScatter(rows) {
  const pairs = rows.filter(r => r.sim != null && r.q12 != null);
  if (!pairs.length) return emptyFig('No pairs to plot yet.');
  const W = 520, H = 400, L = 46, R = 22, T = 18, B = 52;
  const x = v => L + ((v - AX.min) / (AX.max - AX.min)) * (W - L - R);
  const y = v => T + (1 - (v - AX.min) / (AX.max - AX.min)) * (H - T - B);
  const r = pearson(pairs.map(p => p.sim), pairs.map(p => p.q12));
  const grid = [1, 2, 3, 4, 5].map(v => `
    <line x1="${L}" y1="${y(v)}" x2="${W - R}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/>
    <line x1="${x(v)}" y1="${T}" x2="${x(v)}" y2="${H - B}" stroke="var(--grid)" stroke-width="1"/>
    <text x="${L - 8}" y="${y(v) + 3.5}" font-size="10" fill="var(--ink-3)" text-anchor="end">${v}</text>
    <text x="${x(v)}" y="${H - B + 16}" font-size="10" fill="var(--ink-3)" text-anchor="middle">${v}</text>`).join('');
  const pts = pairs.map(p => `
    <g>
      <circle cx="${x(p.sim)}" cy="${y(p.q12)}" r="6.5" fill="var(--a)" stroke="var(--surface)" stroke-width="2"
        data-tip="<b>${esc(p.code)} · ${esc(progShort(p.programme))}</b><br>Simulation ${r2(p.sim)}<br>Q12 ${r2(p.q12)}<br>Self-rating ${p.anchor == null ? '—' : p.anchor + '/10'}"/>
      <text x="${x(p.sim) + 11}" y="${y(p.q12) + 3.5}" font-size="10.5" fill="var(--ink)">${esc(p.code)}</text>
    </g>`).join('');
  return `<figure>
    <svg class="viz" viewBox="0 0 ${W} ${H}" role="img"
      aria-label="Simulation index against Q12 index per respondent, with the line of perfect agreement">
      ${grid}
      <line x1="${x(1)}" y1="${y(1)}" x2="${x(5)}" y2="${y(5)}" stroke="var(--dash)" stroke-width="1.5" stroke-dasharray="5 4"/>
      <text x="${x(4.35)}" y="${y(4.35) - 8}" font-size="9.5" fill="var(--ink-3)">perfect agreement</text>
      ${pts}
      <text x="${(L + W - R) / 2}" y="${H - 14}" font-size="10.5" fill="var(--ink-2)" text-anchor="middle">Mode A · simulation index</text>
      <text x="14" y="${(T + H - B) / 2}" font-size="10.5" fill="var(--ink-2)" text-anchor="middle" transform="rotate(-90 14 ${(T + H - B) / 2})">Mode B · Q12 index</text>
    </svg>
    <p class="p-note">${r == null
      ? 'A correlation needs at least three complete pairs to compute.'
      : `Pearson r = <span class="mono">${r2(r)}</span> across ${pairs.length} pairs. At this n, r is indicative only — read the positions, not the coefficient.`}
      Points above the dashed line are respondents the Q12 rated higher than the simulation did.</p>
  </figure>`;
}

/* V5 · cost of measurement — minutes on task and data captured */
function chartCost(rows) {
  const any = rows.some(r => r.simSecs || r.q12Secs);
  if (!any) return emptyFig('No timing data yet.');
  const W = 640, L = 96, R = 66, T = 10, rowH = 44, barH = 13;
  const H = T + rows.length * rowH + 26;
  const maxS = Math.max(60, ...rows.flatMap(r => [r.simSecs || 0, r.q12Secs || 0])) * 1.12;
  const x = s => L + (s / maxS) * (W - L - R);
  const ticks = [0, 0.25, 0.5, 0.75, 1].map(f => {
    const s = maxS * f;
    return `<line x1="${x(s)}" y1="${T}" x2="${x(s)}" y2="${T + rows.length * rowH - 8}" stroke="var(--grid)" stroke-width="1"/>
      <text x="${x(s)}" y="${H - 8}" font-size="10" fill="var(--ink-3)" text-anchor="middle">${Math.round(s / 60)}m</text>`;
  }).join('');
  const bars = rows.map((r, i) => {
    const top = T + i * rowH + 4;
    const bar = (secs, cls, yy, label, pts) => secs == null ? '' :
      `<rect x="${L}" y="${yy}" width="${Math.max(1, x(secs) - L)}" height="${barH}" rx="3" fill="var(--${cls})"
        data-tip="<b>${esc(r.code)} · ${label}</b><br>${mmss(secs)} on task<br>${pts} data points captured"/>
       <text x="${x(secs) + 7}" y="${yy + barH - 3}" font-size="10.5" fill="var(--ink)">${mmss(secs)}</text>`;
    return `<g>
      <text x="${L - 10}" y="${top + 11}" font-size="11" fill="var(--ink)" text-anchor="end">${esc(r.code)}</text>
      <text x="${L - 10}" y="${top + 24}" font-size="9" fill="var(--ink-3)" text-anchor="end">${esc(progShort(r.programme))}</text>
      ${bar(r.simSecs, 'a', top, 'Mode A', r.pointsA)}
      ${bar(r.q12Secs, 'b', top + barH + 2, 'Mode B', r.pointsB)}
    </g>`;
  }).join('');
  const mA = median(rows.map(r => r.simSecs).filter(Boolean)), mB = median(rows.map(r => r.q12Secs).filter(Boolean));
  const pA = mean(rows.map(r => r.pointsA)), pB = mean(rows.map(r => r.pointsB));
  return `<figure>${legendAB}
    <svg class="viz" viewBox="0 0 ${W} ${H}" role="img" aria-label="Time on task per respondent for each mode">
      ${ticks}${bars}
      <line x1="${L}" y1="${T}" x2="${L}" y2="${T + rows.length * rowH - 8}" stroke="var(--rule-2)" stroke-width="1"/>
    </svg>
    <p class="p-note">Median time on task: Mode A <span class="mono">${mmss(mA)}</span> · Mode B <span class="mono">${mmss(mB)}</span>.
      Mean data points captured per respondent: Mode A <span class="mono">${r0(pA)}</span> · Mode B <span class="mono">${r0(pB)}</span>
      — the simulation costs ${mA && mB ? r1(mA / mB) : '—'}× the minutes and returns ${pA && pB ? r1(pA / pB) : '—'}× the observations.</p>
  </figure>`;
}

/* V6 · respondent experience — how each mode felt to answer */
function chartExp(rows) {
  const has = rows.some(r => Object.keys(r.exp.sim || {}).length);
  if (!has) return emptyFig('No experience ratings yet.');
  const W = 640, L = 176, R = 54, T = 10, rowH = 42, barH = 12;
  const H = T + EXP_ITEMS.length * rowH + 26;
  const x = v => L + ((v - AX.min) / (AX.max - AX.min)) * (W - L - R);
  const vgrid = [1, 2, 3, 4, 5].map(v =>
    `<line x1="${x(v)}" y1="${T}" x2="${x(v)}" y2="${T + EXP_ITEMS.length * rowH - 8}" stroke="var(--grid)" stroke-width="1"/>
     <text x="${x(v)}" y="${H - 8}" font-size="10" fill="var(--ink-3)" text-anchor="middle">${v}</text>`).join('');
  const bars = EXP_ITEMS.map((it, i) => {
    const a = mean(rows.map(r => (r.exp.sim || {})[it.id]).filter(v => v != null));
    const b = mean(rows.map(r => (r.exp.q12 || {})[it.id]).filter(v => v != null));
    const top = T + i * rowH + 4;
    const bar = (v, cls, yy, label) => v == null ? '' :
      `<rect x="${x(AX.min)}" y="${yy}" width="${Math.max(1, x(v) - x(AX.min))}" height="${barH}" rx="3" fill="var(--${cls})"
        data-tip="<b>${label}</b><br>${esc(it.t)}<br>Mean agreement ${r2(v)} / 5"/>
       <text x="${x(v) + 7}" y="${yy + barH - 2}" font-size="10.5" fill="var(--ink)">${r2(v)}</text>`;
    const words = esc(it.t).split(' ');
    const half = Math.ceil(words.length / 2);
    return `<g>
      <text x="${L - 10}" y="${top + 10}" font-size="10" fill="var(--ink)" text-anchor="end">${words.slice(0, half).join(' ')}</text>
      <text x="${L - 10}" y="${top + 22}" font-size="10" fill="var(--ink)" text-anchor="end">${words.slice(half).join(' ')}</text>
      ${bar(a, 'a', top, 'Mode A · simulation')}
      ${bar(b, 'b', top + barH + 2, 'Mode B · Q12')}
    </g>`;
  }).join('');
  const prefs = rows.map(r => r.exp.preferred).filter(Boolean);
  const tally = k => prefs.filter(p => p === k).length;
  return `<figure>${legendAB}
    <svg class="viz" viewBox="0 0 ${W} ${H}" role="img" aria-label="Mean respondent agreement on four experience statements, per mode">
      ${vgrid}${bars}
      <line x1="${x(AX.min)}" y1="${T}" x2="${x(AX.min)}" y2="${T + EXP_ITEMS.length * rowH - 8}" stroke="var(--rule-2)" stroke-width="1"/>
    </svg>
    <p class="p-note">Asked which described the job more truthfully:
      simulation <span class="mono">${tally('sim')}</span> · both equally <span class="mono">${tally('equal')}</span> · Q12 <span class="mono">${tally('q12')}</span>.
      Preferred measurement cadence: ${['weekly', 'monthly', 'quarterly', 'annual'].map(c =>
        `${c} <span class="mono">${rows.filter(r => r.exp.cadence === c).length}</span>`).join(' · ')}.</p>
  </figure>`;
}

/* V7 · the signal the annual survey cannot see */
function chartTrace(row, opt = {}) {
  const tr = (row.trace || []).map((v, i) => ({ v, i })).filter(p => p.v != null);
  if (!tr.length) return emptyFig('No trace recorded.');
  const W = 640, H = opt.compact ? 230 : 260, L = 34, R = 20, T = 18, B = 46;
  const x = i => L + (i / (STATIONS.length - 1)) * (W - L - R);
  const y = v => T + (1 - (v - AX.min) / (AX.max - AX.min)) * (H - T - B);
  const grid = [1, 2, 3, 4, 5].map(v => yGrid(L, W - R, y(v), v.toFixed(0))).join('');
  const line = tr.map((p, k) => `${k ? 'L' : 'M'}${x(p.i).toFixed(1)} ${y(p.v).toFixed(1)}`).join(' ');
  const area = `${line} L${x(tr[tr.length - 1].i).toFixed(1)} ${y(1)} L${x(tr[0].i).toFixed(1)} ${y(1)} Z`;
  const q12 = row.q12, avg = mean(tr.map(p => p.v));
  const dots = tr.map((p, k) => {
    const st = STATIONS[p.i];
    const ans = (row.answers || [])[p.i];
    const chosen = ans ? (st.opts.find(o => o.v === ans.value) || {}).t : '';
    const last = k === tr.length - 1;
    return `<circle cx="${x(p.i)}" cy="${y(p.v)}" r="${last ? 5.5 : 4}" fill="var(--a)" stroke="var(--surface)" stroke-width="2"
      data-tip="<b>${esc(st.t)} · ${esc(DIM[st.dim].name)}</b><br>${esc(chosen)}<br>Scored ${r2(p.v)} / 5${ans && ans.ms ? ' · answered in ' + (ans.ms / 1000).toFixed(1) + 's' : ''}${ans && ans.revisions ? ' · changed ' + ans.revisions + '×' : ''}"/>`;
  }).join('');
  const xlab = STATIONS.map((s, i) => i % 2 === 0
    ? `<text x="${x(i)}" y="${H - B + 18}" font-size="9" fill="var(--ink-3)" text-anchor="middle">${esc(s.t)}</text>` : '').join('');
  return `<figure>
    <svg class="viz" viewBox="0 0 ${W} ${H}" role="img"
      aria-label="Engagement score at each station across the simulated workday, against the flat Q12 index">
      ${grid}
      <path d="${area}" fill="var(--a-soft)"/>
      <path d="${line}" fill="none" stroke="var(--a)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${q12 != null ? `<line x1="${L}" y1="${y(q12)}" x2="${W - R}" y2="${y(q12)}" stroke="var(--b)" stroke-width="2" stroke-dasharray="6 4"/>
        <text x="${W - R}" y="${y(q12) - 7}" font-size="9.5" fill="var(--ink-2)" text-anchor="end">Q12 index ${r2(q12)}</text>` : ''}
      ${dots}${xlab}
      <text x="${L}" y="${H - 8}" font-size="9.5" fill="var(--ink-3)">station time across one retrospective workday</text>
    </svg>
    <p class="p-note">Within-day range <span class="mono">${r2(Math.min(...tr.map(p => p.v)))}–${r2(Math.max(...tr.map(p => p.v)))}</span>,
      mean <span class="mono">${r2(avg)}</span>. The Q12 returns one number for the whole of this line.</p>
  </figure>`;
}
const emptyFig = msg => `<div class="empty"><p class="small">${esc(msg)}</p></div>`;

/* ── 18b · SCREEN · INSTRUMENT DESIGN ─────────────────────────────
   The design record: construct, dimensions, the full item bank, the
   scoring model and the limitations. Open during the live demo.      */
function renderMethods() {
  screen = 'methods';
  setRig({ kind: 'plain', label: 'Instrument design', right: '<button class="ghost" id="exitM">Back to the study</button>' });
  paint(`
    <section style="padding:2.5rem 0 1.5rem">
      <p class="eyebrow">Design record · Mode A</p>
      <h1 style="font-size:clamp(1.8rem,4.4vw,2.5rem); margin-top:.7rem">How this instrument was built</h1>
      <p class="lede" style="margin-top:1rem">Every element of the simulation, the dimension it
      measures, the Q12 item it mirrors, and the arithmetic that turns a choice into a score
      comparable with a validated survey.</p>
    </section>

    <div class="card pad stack" style="gap:1rem">
      <p class="eyebrow">1 · Construct</p>
      <h3>What we mean by engagement</h3>
      <p>Engagement is defined here as <strong>the investment of the self in a work role</strong> —
      Kahn's (1990) personal engagement, in which people employ and express themselves physically,
      cognitively and emotionally in role performance. Its expression is the vigour, dedication and
      absorption measured by the UWES (Schaufeli et al., 2002); its antecedents are the job resources
      of the JD-R model (Bakker &amp; Demerouti, 2007). Gallup's Q12 operationalises the same
      construct as twelve actionable workplace conditions with demonstrated links to business
      outcomes (Harter et al., 2002).</p>
      <p class="small">Kahn's three psychological conditions — meaningfulness, safety and
      availability — are what the five dimensions below are chosen to span. We follow Macey and
      Schneider (2008) in treating engagement as a state, not a trait: it is a property of the
      person-in-a-job, which is precisely why a single annual reading is a weak instrument for it.</p>
    </div>

    <div class="card pad stack" style="gap:.2rem; margin-top:1.25rem">
      <p class="eyebrow">2 · Dimensions</p>
      <h3 style="margin-bottom:.6rem">Five dimensions, and how each is operationalised</h3>
      ${DIMS.map(d => `
        <div style="border-top:1px solid var(--rule); padding:1rem 0">
          <div class="row wrap" style="gap:.6rem; align-items:baseline">
            <span class="dim-k">${d.k}</span>
            <span class="dim-n">${esc(d.name)}</span>
            <span class="dim-src">Mode A: ${STATIONS.filter(s => s.dim === d.id).length} stations · Mode B: ${d.q12.map(n => 'Q' + n).join(', ')}</span>
          </div>
          <p class="small" style="margin-top:.45rem"><strong>Why it belongs:</strong> ${esc(d.why)}</p>
          <p class="small" style="margin-top:.3rem"><strong>How Mode A measures it:</strong> ${esc(d.op)}</p>
          <p class="tiny" style="margin-top:.3rem">${esc(d.theory)}</p>
        </div>`).join('')}
      <p class="p-note">The station count per dimension equals the Q12 item count per dimension
      (${DIMS.map(d => d.k + ':' + d.q12.length).join(' · ')}). This weight-matching is deliberate: it
      means any gap between the two indices is attributable to <em>method</em> — concrete scenario
      recall against abstract Likert agreement — and not to one instrument covering more ground.</p>
    </div>

    <div class="card pad stack" style="gap:.2rem; margin-top:1.25rem">
      <p class="eyebrow">3 · Item bank</p>
      <h3 style="margin-bottom:.4rem">All ${STATIONS.length} stations, with their scoring ladders</h3>
      <p class="small" style="margin-bottom:.6rem">Open a station to see the four options and the raw
      value each carries. Option order is shuffled per respondent to remove position bias, using a
      seed derived from the run id so a page refresh does not reshuffle mid-study.</p>
      ${STATIONS.map((st, i) => `
        <details class="bank">
          <summary>
            <span>${esc(st.t)}</span>
            <span><b>${esc(st.prompt)}</b><br><span class="tiny">${DIM[st.dim].k} ${esc(DIM[st.dim].name)} · mirrors ${esc(st.mirrors)}</span></span>
            <span class="tiny">A${String(i + 1).padStart(2, '0')}</span>
          </summary>
          <div class="ladder">
            <p class="small" style="margin-bottom:.4rem; font-style:italic">${esc(st.scene)}</p>
            ${st.opts.map(o => `<div class="rung"><span>raw ${o.v}</span><span>${r2(rescale4to5(o.v))}</span><span>${esc(o.t)}</span></div>`).join('')}
          </div>
        </details>`).join('')}
    </div>

    <div class="card pad stack" style="gap:.7rem; margin-top:1.25rem">
      <p class="eyebrow">4 · Scoring model</p>
      <h3>Turning choices into an index comparable with the Q12</h3>
      <ol class="small" style="margin:.3rem 0 0; padding-left:1.2rem; display:flex; flex-direction:column; gap:.5rem">
        <li>Each station option carries a raw value of 4, 3, 2 or 1, ordered from full presence of the
        condition to its active absence.</li>
        <li>Raw values are linearly rescaled onto the Q12's five-point metric:
        <span class="mono">s = 1 + (raw − 1) × 4/3</span>, giving
        <span class="mono">${[1,2,3,4].map(v => r2(rescale4to5(v))).join(' · ')}</span>. The endpoints
        of the two instruments therefore coincide exactly.</li>
        <li>A dimension score is the unweighted mean of its stations (Mode A) or of its mapped Q12
        items (Mode B).</li>
        <li>The <strong>engagement index</strong> is the unweighted mean of the five dimension scores,
        so each dimension counts equally in each mode. Reported on 1–5 and rescaled to 0–100 as
        <span class="mono">(s − 1) / 4 × 100</span>.</li>
        <li>Bands follow Gallup's convention: <span class="mono">≥ 4.00</span> engaged,
        <span class="mono">3.00–3.99</span> not engaged, <span class="mono">&lt; 3.00</span> actively
        disengaged.</li>
      </ol>
      <p class="p-note">Interaction signals — per-station response latency, the number of times an
      answer was changed, and the within-day trace — are recorded but deliberately excluded from the
      index. They are diagnostic, not construct-valid, and mixing them into the score would make the
      two modes non-comparable.</p>
    </div>

    <div class="card pad stack" style="gap:.7rem; margin-top:1.25rem">
      <p class="eyebrow">5 · Administration</p>
      <h3>How a session is run</h3>
      <p class="small">Both modes are retrospective by construction: every stem names the previous
      employer, and the framing is repeated at the landing page, the intake screen, the Mode A
      briefing and the Mode B bridge. Mode A is always administered first, so that the twelve Q12
      statements cannot prime the scenario choices.</p>
      <p class="small">For three respondents the intended procedure is a briefed sitting on the
      group's own device: consent, Mode A, Mode B, experience block, all in one session of about
      fifteen minutes. Each completed run then appears in the researcher view immediately. Where a
      respondent completes the study on their own device instead, the closing screen issues a result
      code containing their full anonymised record, which the group pastes into
      <em>Researcher view → Data &amp; export → Add a respondent</em>.</p>
      <p class="p-note">Respondents are identified only as R1–R3 with their programme and
      work-history metadata. No name, email or employer name is collected at any point.</p>
    </div>

    <div class="card pad stack" style="gap:.7rem; margin-top:1.25rem">
      <p class="eyebrow">6 · Limitations and ethics</p>
      <h3>What this instrument cannot claim</h3>
      <ul class="small" style="margin:.2rem 0 0; padding-left:1.2rem; display:flex; flex-direction:column; gap:.45rem">
        <li><strong>Three paired observations.</strong> No reliability or validity coefficient is
        estimable at this n. Correlations shown in the researcher view are descriptive only.</li>
        <li><strong>Retrospective recall.</strong> Both modes ask about a job the respondent has
        already left, so both are exposed to recall decay and to post-hoc rationalisation of the
        decision to leave. This is a constant across modes, which protects the comparison but not the
        absolute levels.</li>
        <li><strong>Common method variance.</strong> Both instruments are self-report, collected in
        one sitting from one source, which is the classic condition for inflated convergence
        (Podsakoff et al., 2003). Administering Mode A first and separating the two with a bridge
        screen mitigates but does not remove it.</li>
        <li><strong>Social desirability.</strong> Scenario options that describe silence or
        disengagement may be under-selected even though nothing is scored as good or bad.</li>
        <li><strong>Surveillance risk.</strong> The case for real-time measurement is also the case
        against it. Latency and revision signals are exactly the data that becomes coercive if
        attached to an identified employee inside a live employment relationship. In this study they
        are anonymised, retrospective, and collected with explicit consent; in an organisational
        deployment they would need a stated retention period, aggregation floors below which no team
        is reported, and a real right to decline that carries no career cost.</li>
        <li><strong>Adaptation, not replication.</strong> The Q12 items are reworded into the past
        tense for a former employer. This is required by the study design but means the instrument is
        no longer the validated Q12, and the published benchmarks do not strictly apply.</li>
      </ul>
    </div>

    <div class="card pad stack" style="gap:.5rem; margin-top:1.25rem">
      <p class="eyebrow">7 · References</p>
      <div class="stack" style="gap:.6rem; margin-top:.3rem">
        ${REFS.map(r => `<p class="small" style="padding-left:1.6rem; text-indent:-1.6rem">${r}</p>`).join('')}
      </div>
      <p class="p-note">Q12<sup>®</sup> is a trademark of Gallup, Inc. The retrospective adaptation
      used in Mode B is for educational coursework and is not a Gallup product or endorsement.</p>
    </div>

    <div class="btn-row" style="margin-top:1.75rem">
      <button class="btn btn-2" id="backM">Back to the study</button>
      <a class="tiny" href="#/analysis">Researcher view →</a>
    </div>
  `);
  const back = () => { location.hash = ''; boot(); };
  document.getElementById('backM').onclick = back;
  const ex = document.getElementById('exitM');
  if (ex) ex.onclick = back;
}

/* ── 19 · RESEARCHER VIEW ──────────────────────────────────────────  */
const AV = { tab: 'comparison', pilots: false, dimSel: 'all', traceSel: null };
let dbRuns = [], dbUnsub = null;

function allRuns() {
  const byId = new Map();
  localRuns().forEach(r => byId.set(r.id, r));
  dbRuns.forEach(r => byId.set(r.id, r));        /* the store wins on conflict */
  return [...byId.values()]
    .filter(r => r && r.a && r.b && (r.completedAt || (r.b.endedAt && r.a.endedAt)))
    .sort((a, b) => String(a.code).localeCompare(String(b.code)) || String(a.completedAt).localeCompare(String(b.completedAt)));
}
function activeRows() {
  return allRuns().map(rowFromRun).filter(r => AV.pilots || !r.testRun);
}
function watchDb() {
  if (!DB || dbUnsub) return;
  try {
    dbUnsub = DB.collection('runs').limit(200).onSnapshot(
      snap => { dbRuns = snap.docs.map(d => d.data()).filter(Boolean); if (screen === 'analysis') renderAnalysis(); },
      () => { dbUnsub = null; }
    );
  } catch (e) { dbUnsub = null; }
}

function renderAnalysis() {
  screen = 'analysis';

  if (!store.get(K_GATE, false)) return renderGate();

    <section style="padding:2.25rem 0 1.25rem">

      <h2 style="margin-top:.5rem">Which instrument measured engagement better?</h2>
      <p class="small" style="margin-top:.7rem; max-width:62ch">
        Every figure below is computed from the paired observations in the store — the same three
        respondents answering the same construct twice. Both indices sit on a 1–5 metric built from

      </p>
      <div class="row wrap" style="gap:.9rem; margin-top:1rem">
        <span class="tiny mono">${rows.length} paired observation${rows.length === 1 ? '' : 's'} in analysis</span>
        <span id="dbSlot2"></span>

      </div>

    <div class="tabs" role="tablist">
      ${[['comparison', 'Comparison'], ['data', 'Data & export'], ['qual', 'What only Mode A caught']].map(([k, l]) =>
        `<button class="tab" role="tab" data-tab="${k}" aria-selected="${AV.tab === k}">${l}</button>`).join('')}
    </div>

/* ── 20 · TAB · COMPARISON ─────────────────────────────────────────  */
function tabComparison(rows) {
  if (!rows.length) return `
    <div class="empty">
      <h3 style="margin-bottom:.5rem">No paired observations yet</h3>
      <p class="small" style="max-width:44ch; margin:0 auto">Send the study link to your three
      respondents — one from MBA Core, one from MBA HRM, one from MBA Business Analytics. Each
      completed run appears here as one paired observation. You can also paste a respondent's result
      code under <em>Data &amp; export</em>.</p>
    </div>`;
  const sims = rows.map(r => r.sim).filter(v => v != null);
  const q12s = rows.map(r => r.q12).filter(v => v != null);
  const ds = rows.map(r => r.delta).filter(v => v != null);
  const r = pearson(rows.map(x => x.sim), rows.map(x => x.q12));
  const anchorGapA = mean(rows.filter(x => x.anchor5 != null).map(x => Math.abs(x.sim - x.anchor5)));
  const anchorGapB = mean(rows.filter(x => x.anchor5 != null).map(x => Math.abs(x.q12 - x.anchor5)));
  const closer = (anchorGapA == null || anchorGapB == null) ? null : (anchorGapA < anchorGapB ? 'the simulation' : anchorGapA > anchorGapB ? 'the Q12' : 'neither');
  const traceRow = rows.find(x => x.code === AV.traceSel) || rows[0];

  return `
    <div class="kpis">
      <div class="kpi"><span class="kpi-l">Mode A mean</span><span class="kpi-v">${r2(mean(sims))}</span><span class="kpi-s">simulation index, of 5</span></div>
      <div class="kpi"><span class="kpi-l">Mode B mean</span><span class="kpi-v">${r2(mean(q12s))}</span><span class="kpi-s">Q12 index, of 5</span></div>
      <div class="kpi"><span class="kpi-l">Mean gap</span><span class="kpi-v">${ds.length ? (mean(ds) > 0 ? '+' : '') + r2(mean(ds)) : '—'}</span><span class="kpi-s">A − B, index points</span></div>
      <div class="kpi"><span class="kpi-l">Widest gap</span><span class="kpi-v">${ds.length ? r2(Math.max(...ds.map(Math.abs))) : '—'}</span><span class="kpi-s">largest single disagreement</span></div>
      <div class="kpi"><span class="kpi-l">Pearson r</span><span class="kpi-v">${r == null ? '—' : r2(r)}</span><span class="kpi-s">n = ${rows.length}, indicative</span></div>
      <div class="kpi"><span class="kpi-l">Closer to self-rating</span><span class="kpi-v" style="font-size:1.05rem; font-family:var(--ff-d)">${closer == null ? '—' : closer === 'the simulation' ? 'Mode A' : closer === 'the Q12' ? 'Mode B' : 'Tied'}</span><span class="kpi-s">${anchorGapA == null ? 'no anchor data' : 'mean |gap| ' + r2(anchorGapA) + ' vs ' + r2(anchorGapB)}</span></div>
    </div>

    ${coverageStrip(rows)}

    <div class="panels" style="margin-top:1.25rem">
      <div class="panel panel-full">
        <p class="p-eyebrow">Figure 1 · convergence</p>
        <p class="p-title">Do the two instruments place the same person at the same level?</p>
        <p class="p-q">Each vertical pair is one respondent measured twice. The length of the connector is the disagreement.</p>
        ${chartPaired(rows)}
        <p class="p-note">${narrateConvergence(rows)}</p>
      </div>

      <div class="panel">
        <p class="p-eyebrow">Figure 2 · agreement</p>
        <p class="p-title">Simulation against Q12, respondent by respondent</p>
        <p class="p-q">Distance from the dashed line is the size and direction of the disagreement.</p>
        ${chartScatter(rows)}
      </div>

      <div class="panel">
        <p class="p-eyebrow">Figure 3 · direction of the bias</p>
        <p class="p-title">Which mode reads an engagement higher, and by how much</p>
        <p class="p-q">Positive bars: the simulation read higher than the Q12 for that respondent.</p>
        ${chartDelta(rows)}
      </div>

      <div class="panel panel-full">
        <p class="p-eyebrow">Figure 4 · where the modes diverge</p>
        <p class="p-title">The same five dimensions, measured two ways</p>
        <p class="p-q">Both instruments carry the same number of items per dimension, so a gap here is
        a difference of method — scenario recall against abstract agreement — not of coverage.</p>
        <div class="chips" style="margin:.7rem 0 .3rem">
          <button class="chip" data-dim="all" aria-pressed="${AV.dimSel === 'all'}">All respondents · mean</button>
          ${rows.map(x => `<button class="chip" data-dim="${esc(x.code)}" aria-pressed="${AV.dimSel === x.code}">${esc(x.code)} · ${esc(progShort(x.programme))}</button>`).join('')}
        </div>
        ${chartDims(AV.dimSel === 'all' ? rows : rows.filter(x => x.code === AV.dimSel))}
        <p class="p-note">${narrateDims(rows)}</p>
      </div>

      <div class="panel">
        <p class="p-eyebrow">Figure 5 · cost of measurement</p>
        <p class="p-title">Minutes spent, observations returned</p>
        <p class="p-q">The real-time case has to survive this chart: engagement measured often must be cheap to answer.</p>
        ${chartCost(rows)}
      </div>

      <div class="panel">
        <p class="p-eyebrow">Figure 6 · respondent experience</p>
        <p class="p-title">How each instrument felt to the people answering it</p>
        <p class="p-q">Mean agreement, 1–5, on the same four statements asked about both modes.</p>
        ${chartExp(rows)}
      </div>

      <div class="panel panel-full">
        <p class="p-eyebrow">Figure 7 · what an annual number hides</p>
        <p class="p-title">One respondent's engagement across the simulated day</p>
        <p class="p-q">The dashed line is that respondent's entire Q12 result. The solid line is what
        the simulation saw happening underneath it.</p>
        <div class="chips" style="margin:.7rem 0 .3rem">
          ${rows.map(x => `<button class="chip" data-trace="${esc(x.code)}" aria-pressed="${traceRow && x.code === traceRow.code}">${esc(x.code)} · ${esc(progShort(x.programme))}</button>`).join('')}
        </div>
        ${traceRow ? chartTrace(traceRow) : ''}
      </div>
    </div>

    ${recommendations(rows)}

    <div class="card pad" style="margin-top:1.5rem">
      <p class="p-eyebrow">Reading of the evidence</p>
      <p class="p-title" style="margin-bottom:.6rem">What this sample supports, and what it does not</p>
      <p class="small">${narrateVerdict(rows)}</p>
      <p class="p-note">Three paired observations cannot establish reliability or validity. What they
      can do is show whether the two methods tell the same story about the same person, where they
      part company, and what each costs to run — which is what the figures above are for.</p>
    </div>`;
}

/* Coverage of the three required programmes, and the integrity of the
   pairing — the two things Component B is assessed on. */
function coverageStrip(rows) {
  const cells = PROGRAMMES.map(pr => {
    const hit = rows.filter(r => r.programme === pr);
    const r = hit[0];
    return `<div class="cover-cell ${hit.length ? '' : 'miss'}">
      <p class="eyebrow">${esc(pr)}</p>
      ${hit.length
        ? `<p class="mono" style="font-size:.95rem; color:var(--ink)">${hit.map(h => esc(h.code)).join(', ')} collected</p>
           <p class="tiny">${esc(r.bio.role || 'role not given')} · ${esc(r.bio.industry || 'sector not given')} · ${r.bio.months ?? '—'} months</p>
           <p class="tiny">paired: Mode A ${r.sim != null ? '✓' : '✗'} · Mode B ${r.q12 != null ? '✓' : '✗'} · retrospective framing applied in both</p>`
        : `<p class="mono" style="font-size:.95rem; color:var(--ink-2)">not yet collected</p>
           <p class="tiny">One respondent from this programme with prior full-time experience is still required.</p>`}
    </div>`;
  }).join('');
  const n = PROGRAMMES.filter(pr => rows.some(r => r.programme === pr)).length;
  const complete = rows.filter(r => r.sim != null && r.q12 != null).length;
  return `<div class="stack" style="gap:.6rem; margin-top:.5rem">
    <div class="row wrap" style="gap:.7rem; justify-content:space-between">
      <p class="p-eyebrow">Sample coverage · ${n} of 3 programmes · ${complete} complete pair${complete === 1 ? '' : 's'}</p>
      ${n === 3 ? '<p class="tiny">Coverage requirement met.</p>' : '<p class="tiny">Coverage incomplete — the comparison is not yet representative of all three programmes.</p>'}
    </div>
    <div class="cover">${cells}</div>
  </div>`;
}

function narrateConvergence(rows) {
  const ds = rows.map(r => r.delta).filter(v => v != null);
  if (!ds.length) return 'No paired scores yet.';
  const bias = mean(ds), worst = rows.filter(r => r.delta != null).sort((a, b) => Math.abs(b.delta) - Math.abs(a.delta))[0];
  const sameBand = rows.filter(r => band(r.sim).label === band(r.q12).label).length;
  return `Across ${ds.length} respondent${ds.length === 1 ? '' : 's'} the simulation ran
    ${Math.abs(bias) < 0.05 ? 'level with' : (bias > 0 ? 'above' : 'below')} the Q12 by
    <span class="mono">${r2(Math.abs(bias))}</span> index points on average, and the two instruments
    assigned the same engagement band to <span class="mono">${sameBand}/${rows.length}</span> of them.
    The widest single disagreement is ${esc(worst.code)} at <span class="mono">${r2(Math.abs(worst.delta))}</span>
    points — ${worst.delta > 0 ? 'the scenarios recovered engagement the questionnaire missed' : 'the questionnaire returned a more favourable reading than the scenarios did'}.`;
}
function narrateDims(rows) {
  const gaps = DIMS.map(d => {
    const a = mean(rows.map(r => r.simDims[d.id]).filter(v => v != null));
    const b = mean(rows.map(r => r.q12Dims[d.id]).filter(v => v != null));
    return { d, a, b, g: (a != null && b != null) ? a - b : null };
  }).filter(x => x.g != null);
  if (!gaps.length) return 'No dimension data yet.';
  const wide = [...gaps].sort((x, y) => Math.abs(y.g) - Math.abs(x.g))[0];
  const tight = [...gaps].sort((x, y) => Math.abs(x.g) - Math.abs(y.g))[0];
  return `The modes agree most closely on <strong>${esc(tight.d.name)}</strong>
    (gap <span class="mono">${r2(Math.abs(tight.g))}</span>) and diverge most on
    <strong>${esc(wide.d.name)}</strong> (gap <span class="mono">${r2(Math.abs(wide.g))}</span>,
    ${wide.g > 0 ? 'simulation higher' : 'Q12 higher'}). Dimensions that ask a respondent to recall a
    concrete episode — recognition, voice — are where a scenario and an abstract Likert statement are
    least likely to return the same number.`;
}
/* Recommendations are derived, not asserted: dimensions are ranked by
   their level across both modes, and each recommendation carries the
   evidence line it rests on. */
function recommendations(rows) {
  if (!rows.length) return '';
  const scored = DIMS.map(d => {
    const a = mean(rows.map(r => r.simDims[d.id]).filter(v => v != null));
    const b = mean(rows.map(r => r.q12Dims[d.id]).filter(v => v != null));
    const both = [a, b].filter(v => v != null);
    return { d, a, b, level: mean(both), gap: (a != null && b != null) ? a - b : null };
  }).filter(x => x.level != null).sort((x, y) => x.level - y.level);

  const mA = median(rows.map(r => r.simSecs).filter(Boolean));
  const mB = median(rows.map(r => r.q12Secs).filter(Boolean));
  const pA = mean(rows.map(r => r.pointsA)), pB = mean(rows.map(r => r.pointsB));
  const cad = ['weekly', 'monthly', 'quarterly', 'annual'].map(c => ({ c, n: rows.filter(r => r.exp.cadence === c).length }));
  const wantsFrequent = cad.filter(x => x.c === 'weekly' || x.c === 'monthly').reduce((s, x) => s + x.n, 0);
  const widest = [...scored].sort((x, y) => Math.abs(y.gap || 0) - Math.abs(x.gap || 0))[0];
  const sameBand = rows.filter(r => band(r.sim).label === band(r.q12).label).length;
  const incidents = rows.filter(r => r.incident).length;

  const items = [
    ...scored.slice(0, 2).map(x => ({
      t: `Act on ${x.d.name.toLowerCase()} first`,
      e: `Weakest dimension across both instruments — Mode A ${r2(x.a)}, Mode B ${r2(x.b)}, mean ${r2(x.level)} of 5.`,
      a: x.d.action
    })),
    {
      t: 'Keep the annual survey as the benchmark, not as the diagnostic',
      e: `The two instruments placed ${sameBand} of ${rows.length} respondents in the same engagement band, with a mean gap of ${r2(Math.abs(mean(rows.map(r => r.delta).filter(v => v != null))))} index points — close enough to trend against, too coarse to act on.`,
      a: 'Retain a validated annual instrument for external benchmarking and year-on-year comparability. Do not ask it to tell you where in the working week engagement is lost; it has no field for that.'
    },
    {
      t: `Run the scenario pulse ${wantsFrequent > rows.length / 2 ? 'monthly' : 'quarterly'}, on the evidence of what respondents will tolerate`,
      e: `Respondents chose: ${cad.map(x => x.c + ' ' + x.n).join(' · ')}. Mode A costs ${mmss(mA)} against the Q12's ${mmss(mB)} and returns ${pA && pB ? r1(pA / pB) : '—'}× the observations per respondent.`,
      a: `Deploy the simulation at the cadence respondents actually asked for, scoped to one dimension per cycle so a single sitting stays under five minutes. Frequency is worth more than length: a shorter instrument answered honestly beats a longer one answered dutifully.`
    },
    {
      t: `Treat the ${widest && widest.gap != null ? widest.d.name.toLowerCase() : 'largest'} divergence as a measurement finding, not noise`,
      e: widest && widest.gap != null
        ? `Widest mode disagreement: ${esc(widest.d.name)}, ${r2(Math.abs(widest.gap))} points, ${widest.gap > 0 ? 'simulation higher' : 'Q12 higher'}.`
        : 'Dimension-level gaps require both modes scored for at least one respondent.',
      a: 'Where a scenario and a Likert statement disagree on the same dimension, the abstract item is usually measuring a belief about the workplace while the scenario is measuring a remembered event. Report both and say which decision each is fit for.'
    },
    {
      t: 'Instrument the qualitative channel deliberately',
      e: `${incidents} of ${rows.length} respondents recorded a critical incident in their own words; the Q12 returned ${r0(pB)} numbers and no text.`,
      a: 'Attach one open prompt to every pulse and route the responses to the manager who can act, with identity stripped. The index tells you the level; only the incident tells you the cause.'
    }
  ];
  return `<div class="card pad" style="margin-top:1.5rem">
    <p class="p-eyebrow">Recommendations · prioritised, and traced to the figures above</p>
    <p class="p-title" style="margin-bottom:.3rem">What we would tell an HR function to do with this</p>
    <p class="p-q" style="margin-bottom:.4rem">Ordered by the strength of the evidence behind them. Items 1–2 are read off the dimension profile; 3–5 from the cost, experience and divergence figures.</p>
    ${items.map((it, i) => `<div class="rec">
      <span class="rec-n">${String(i + 1).padStart(2, '0')}</span>
      <div><p class="rec-t">${esc(it.t)}</p><p class="rec-e">Evidence · ${it.e}</p><p class="small">${esc(it.a)}</p></div>
    </div>`).join('')}
  </div>`;
}

function narrateVerdict(rows) {
  const ds = rows.map(r => r.delta).filter(v => v != null);
  if (!ds.length) return 'Collect at least one paired observation to populate this reading.';
  const bias = mean(ds);
  const mA = median(rows.map(r => r.simSecs).filter(Boolean)), mB = median(rows.map(r => r.q12Secs).filter(Boolean));
  const pA = mean(rows.map(r => r.pointsA)), pB = mean(rows.map(r => r.pointsB));
  const prefSim = rows.filter(r => r.exp.preferred === 'sim').length;
  const anchorGapA = mean(rows.filter(x => x.anchor5 != null).map(x => Math.abs(x.sim - x.anchor5)));
  const anchorGapB = mean(rows.filter(x => x.anchor5 != null).map(x => Math.abs(x.q12 - x.anchor5)));
  return `On the level of the construct the two instruments are close: a mean gap of
    <span class="mono">${(bias > 0 ? '+' : '') + r2(bias)}</span> index points on a five-point scale.
    They are not close on what they return for the cost. The Q12 takes
    <span class="mono">${mmss(mB)}</span> and yields <span class="mono">${r0(pB)}</span> numbers per
    respondent; the simulation takes <span class="mono">${mmss(mA)}</span> and yields
    <span class="mono">${r0(pA)}</span> observations plus a within-day trace, a recalled critical
    incident and, where it ran, an adaptive probe.
    ${anchorGapA != null ? `Against each respondent's own overall self-rating, ${anchorGapA < anchorGapB ? 'the simulation' : anchorGapA > anchorGapB ? 'the Q12' : 'neither mode'} sat closer
    (mean absolute gap <span class="mono">${r2(anchorGapA)}</span> against <span class="mono">${r2(anchorGapB)}</span>).` : ''}
    ${prefSim ? `<span class="mono">${prefSim}/${rows.length}</span> respondents judged the simulation the
    more truthful description of the job.` : ''}
    The defensible reading is therefore not that one instrument wins outright, but that they answer
    different questions: the Q12 is the cheaper, comparable, benchmarkable annual measure, while the
    simulation is the diagnostic that says <em>where</em> in a working day engagement is won or lost —
    which is the thing a manager can actually act on.`;
}

/* ── 23 · TAB WIRING & EXPORT ──────────────────────────────────────  */
function wireTab(rows) {
  stage.querySelectorAll('[data-dim]').forEach(c => c.onclick = () => { AV.dimSel = c.dataset.dim; renderAnalysis(); });
  stage.querySelectorAll('[data-trace]').forEach(c => c.onclick = () => { AV.traceSel = c.dataset.trace; renderAnalysis(); });
  stage.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    const id = b.dataset.del;
    const row = rows.find(r => r.id === id);
    if (!confirm(`Remove respondent ${row ? row.code : id} from the dataset? This deletes the run from this browser and, if connected, from the store. It cannot be undone.`)) return;
    store.set(K_RUNS, localRuns().filter(r => r.id !== id));
    if (DB) { try { await DB.collection('runs').doc(id).delete(); } catch (e) {} }
    dbRuns = dbRuns.filter(r => r.id !== id);
    renderAnalysis();
  });
  const sum = document.getElementById('csvSum');
  if (sum) sum.onclick = () => deliver('shift-signal-summary.csv', csvSummary(rows), 'expMsg');
  const it = document.getElementById('csvItems');
  if (it) it.onclick = () => deliver('shift-signal-items.csv', csvItems(rows), 'expMsg');
  const js = document.getElementById('csvJson');
  if (js) js.onclick = () => deliver('shift-signal-runs.json', JSON.stringify(allRuns().filter(r => AV.pilots || !r.testRun), null, 2), 'expMsg');
  const imp = document.getElementById('impGo');
  if (imp) imp.onclick = async () => {
    const msg = document.getElementById('impMsg');
    const r = decodeRun(document.getElementById('impBox').value);
    if (!r) { msg.textContent = 'That code could not be read. Copy the whole block, with nothing added.'; return; }
    if (allRuns().some(x => x.id === r.id)) { msg.textContent = 'That respondent is already in the dataset.'; return; }
    r.scores = computeScores(r); r.points = dataPoints(r);
    await persist(r);
    msg.textContent = `Imported ${r.code || 'respondent'}.`;
    renderAnalysis();
  };
}

const c2 = n => n == null ? '' : (Math.round(n * 100) / 100).toFixed(2);
const c0 = n => n == null ? '' : String(Math.round(n));
const q = v => { const s = String(v == null ? '' : v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
function csvSummary(rows) {
  const head = ['respondent_code', 'programme', 'is_pilot', 'sector', 'role', 'months_experience', 'team_size',
    'completed_at', 'mode_a_index_1_5', 'mode_a_index_0_100', 'mode_b_index_1_5', 'mode_b_index_0_100',
    'delta_a_minus_b', 'self_rating_0_10', 'q0_overall_satisfaction',
    ...DIMS.map(d => 'a_' + d.id), ...DIMS.map(d => 'b_' + d.id),
    'mode_a_seconds', 'mode_b_seconds', 'answer_revisions', 'median_latency_ms',
    'mode_a_data_points', 'mode_b_data_points',
    ...EXP_ITEMS.map(i => 'exp_sim_' + i.id), ...EXP_ITEMS.map(i => 'exp_q12_' + i.id),
    'preferred_mode', 'preferred_cadence', 'would_stay', 'would_recommend',
    'critical_incident', 'adaptive_probe_question', 'adaptive_probe_answer'];
  const lines = rows.map(r => [r.code, r.programme, r.testRun ? 'yes' : 'no', r.bio.industry, r.bio.role,
    r.bio.months, r.bio.teamSize, r.completedAt, c2(r.sim), c0(r.sim100), c2(r.q12), c0(r.q12100),
    r.delta == null ? '' : c2(r.delta), r.anchor, r.q0,
    ...DIMS.map(d => c2(r.simDims[d.id])), ...DIMS.map(d => c2(r.q12Dims[d.id])),
    r.simSecs, r.q12Secs, r.revisions, r.medianLatency, r.pointsA, r.pointsB,
    ...EXP_ITEMS.map(i => (r.exp.sim || {})[i.id]), ...EXP_ITEMS.map(i => (r.exp.q12 || {})[i.id]),
    r.exp.preferred, r.exp.cadence, r.stay, r.recommend, r.incident, r.probeQ, r.probeA].map(q).join(','));
  return [head.join(','), ...lines].join('\n');
}
function csvItems(rows) {
  const head = ['respondent_code', 'programme', 'mode', 'item_id', 'station_time', 'dimension',
    'mirrors_q12_item', 'item_text', 'chosen_text', 'raw_score', 'scaled_1_5', 'latency_ms', 'revisions'];
  const out = [];
  rows.forEach(r => {
    STATIONS.forEach((s, i) => {
      const a = (r.answers || [])[i];
      const chosen = a ? (s.opts.find(o => o.v === a.value) || {}).t : '';
      out.push([r.code, r.programme, 'A_simulation', 'A' + String(i + 1).padStart(2, '0'), s.t,
        DIM[s.dim].name, s.mirrors, s.prompt, chosen, a ? a.value : '',
        a ? c2(rescale4to5(a.value)) : '', a ? a.ms : '', a ? a.revisions : ''].map(q).join(','));
    });
    Q12.forEach(qq => {
      const v = (r.q12Raw || {})['q' + qq.n];
      out.push([r.code, r.programme, 'B_gallup_q12', 'Q' + qq.n, '', DIM[qq.dim].name, 'Q' + qq.n,
        qq.t, '', v ?? '', v == null ? '' : c2(v), '', ''].map(q).join(','));
    });
    const v0 = (r.q12Raw || {}).q0;
    out.push([r.code, r.programme, 'B_gallup_q12', 'Q0', '', 'overall satisfaction', 'Q0', Q0, '',
      v0 ?? '', v0 == null ? '' : c2(v0), '', ''].map(q).join(','));
  });
  return [head.join(','), ...out].join('\n');
}
async function deliver(filename, text, msgId) {
  const msg = document.getElementById(msgId);
  if (DL) {
    try {
      const res = await DL.save({ filename, data: text });
      msg.textContent = res && res.status === 'saved' ? `Saved ${filename}.` : `${filename} handed to your device.`;
      return;
    } catch (e) {
      if (e && e.code === 'cancelled') { msg.textContent = 'Save cancelled.'; return; }
    }
  }
  try { await navigator.clipboard.writeText(text); msg.textContent = `Copied ${filename} to the clipboard — paste it into a file.`; }
  catch (e) { msg.textContent = 'Could not save or copy here. Use “Export full JSON” from a desktop browser.'; }
}

/* ── 24 · BOOT & ROUTING ───────────────────────────────────────────  */
function resumeScreen() {
  if (!run || !run.consent) return renderLanding();
  if (run.completedAt) { run = null; store.del(K_RUN); return renderLanding(); }
  if (run.b.endedAt) return renderExperience();
  if (run.b.startedAt) return renderQ12();
  if (run.a.endedAt) return renderBridge();
  if (run.a.startedAt) {
    const nextIx = run.a.answers.findIndex(a => !a);
    if (nextIx === -1) return renderSimExtras();
    stationIx = Math.max(0, nextIx);
    return renderStation();
  }
  return renderSimIntro();
}
function boot() {
  if (location.hash.startsWith('#/analysis')) return renderAnalysis();
  if (location.hash.startsWith('#/methods')) return renderMethods();
  const partial = store.get(K_RUN, null);
  run = partial && partial.a && partial.b ? partial : null;
  if (run) return resumeScreen();
  renderLanding();
}
window.addEventListener('hashchange', boot);
window.addEventListener('scroll', hideTip, { passive: true });
boot();
initCaps();
</script>
