      completed run appears here. You can also paste a respondent's result code under
      <em>Data &amp; export</em>.</p>
    </div>`;
  const sims = rows.map(r => r.sim).filter(v => v != null);
  const anchorGap = mean(rows.filter(x => x.anchor5 != null).map(x => Math.abs(x.sim - x.anchor5)));
  const mSecs = median(rows.map(r => r.simSecs).filter(Boolean));
  const bands = { g: 0, w: 0, c: 0 };
  rows.forEach(r => { const b = band(r.sim).cls; if (bands[b] != null) bands[b]++; });
  const traceRow = rows.find(x => x.code === AV.traceSel) || rows[0];

  return `
    <div class="kpis">
      <div class="kpi"><span class="kpi-l">Mean index</span><span class="kpi-v">${r2(mean(sims))}</span><span class="kpi-s">of 5, across the sample</span></div>
      <div class="kpi"><span class="kpi-l">Engaged</span><span class="kpi-v">${bands.g}/${rows.length}</span><span class="kpi-s">index ≥ 4.00</span></div>
      <div class="kpi"><span class="kpi-l">Actively disengaged</span><span class="kpi-v">${bands.c}/${rows.length}</span><span class="kpi-s">index &lt; 3.00</span></div>
      <div class="kpi"><span class="kpi-l">Self-rating gap</span><span class="kpi-v">${anchorGap == null ? '—' : r2(anchorGap)}</span><span class="kpi-s">mean |index − self-rating|</span></div>
      <div class="kpi"><span class="kpi-l">Median time on task</span><span class="kpi-v" style="font-size:1.3rem">${mmss(mSecs)}</span><span class="kpi-s">per respondent</span></div>
    </div>

    ${coverageStrip(rows)}

    <div class="panels" style="margin-top:1.25rem">
      <div class="panel panel-full">
        <p class="p-eyebrow">Figure 1 · dimension profile</p>
        <p class="p-title">Where the sample is strongest, and where it isn't</p>
        <p class="p-q">Mean score per dimension across the respondents in view.</p>
        <div class="chips" style="margin:.7rem 0 .3rem">
          <button class="chip" data-dim="all" aria-pressed="${AV.dimSel === 'all'}">All respondents · mean</button>
          ${rows.map(x => `<button class="chip" data-dim="${esc(x.code)}" aria-pressed="${AV.dimSel === x.code}">${esc(x.code)} · ${esc(progShort(x.programme))}</button>`).join('')}
        </div>
        ${chartDims(AV.dimSel === 'all' ? rows : rows.filter(x => x.code === AV.dimSel))}
        <p class="p-note">${narrateDims(rows)}</p>
      </div>

      <div class="panel">
        <p class="p-eyebrow">Figure 2 · cost of measurement</p>
        <p class="p-title">Minutes spent, observations returned</p>
        <p class="p-q">A frequent pulse only works if a single sitting is cheap to answer.</p>
        ${chartCost(rows)}
      </div>

      <div class="panel panel-full">
        <p class="p-eyebrow">Figure 3 · what an annual number hides</p>
        <p class="p-title">One respondent's engagement across the simulated day</p>
        <p class="p-q">A single annual score is the flat average of a line that is never flat.</p>
        <div class="chips" style="margin:.7rem 0 .3rem">
          ${rows.map(x => `<button class="chip" data-trace="${esc(x.code)}" aria-pressed="${traceRow && x.code === traceRow.code}">${esc(x.code)} · ${esc(progShort(x.programme))}</button>`).join('')}
        </div>
        ${traceRow ? chartTrace(traceRow) : ''}
      </div>
    </div>

    ${recommendations(rows)}`;
}

/* Coverage of the three required programmes — the thing Component B
   is assessed on. */
function coverageStrip(rows) {
  const cells = PROGRAMMES.map(pr => {
    const hit = rows.filter(r => r.programme === pr);
    const r = hit[0];
    return `<div class="cover-cell ${hit.length ? '' : 'miss'}">
      <p class="eyebrow">${esc(pr)}</p>
      ${hit.length
        ? `<p class="mono" style="font-size:.95rem; color:var(--ink)">${hit.map(h => esc(h.code)).join(', ')} collected</p>
           <p class="tiny">${esc(r.bio.role || 'role not given')} · ${esc(r.bio.industry || 'sector not given')} · ${r.bio.months ?? '—'} months</p>`
        : `<p class="mono" style="font-size:.95rem; color:var(--ink-2)">not yet collected</p>
           <p class="tiny">One respondent from this programme with prior full-time experience is still required.</p>`}
    </div>`;
  }).join('');
  const n = PROGRAMMES.filter(pr => rows.some(r => r.programme === pr)).length;
  return `<div class="stack" style="gap:.6rem; margin-top:.5rem">
    <div class="row wrap" style="gap:.7rem; justify-content:space-between">
      <p class="p-eyebrow">Sample coverage · ${n} of 3 programmes · ${rows.length} respondent${rows.length === 1 ? '' : 's'}</p>
      ${n === 3 ? '<p class="tiny">Coverage requirement met.</p>' : '<p class="tiny">Coverage incomplete — the sample is not yet representative of all three programmes.</p>'}
    </div>
    <div class="cover">${cells}</div>
  </div>`;
}

function narrateDims(rows) {
  const levels = DIMS.map(d => ({ d, a: mean(rows.map(r => r.simDims[d.id]).filter(v => v != null)) })).filter(x => x.a != null);
  if (!levels.length) return 'No dimension data yet.';
  const high = [...levels].sort((x, y) => y.a - x.a)[0];
  const low = [...levels].sort((x, y) => x.a - y.a)[0];
  return `The sample scores highest on <strong>${esc(high.d.name)}</strong>
    (mean <span class="mono">${r2(high.a)}</span>) and lowest on <strong>${esc(low.d.name)}</strong>
    (mean <span class="mono">${r2(low.a)}</span>) — a spread of
    <span class="mono">${r2(high.a - low.a)}</span> index points.`;
}
/* Recommendations are derived, not asserted: dimensions are ranked by
   their level across the sample, and each recommendation carries the
   evidence line it rests on. */
function recommendations(rows) {
  if (!rows.length) return '';
  const scored = DIMS.map(d => ({ d, a: mean(rows.map(r => r.simDims[d.id]).filter(v => v != null)) }))
    .filter(x => x.a != null).sort((x, y) => x.a - y.a);

  const mA = median(rows.map(r => r.simSecs).filter(Boolean));
  const pA = mean(rows.map(r => r.points));
  const ranges = rows.map(r => (r.trace || []).filter(v => v != null)).filter(t => t.length)
    .map(t => Math.max(...t) - Math.min(...t));
  const widestRange = ranges.length ? Math.max(...ranges) : null;
  const incidents = rows.filter(r => r.incident).length;

  const items = [
    ...scored.slice(0, 2).map(x => ({
      t: `Act on ${x.d.name.toLowerCase()} first`,
      e: `Weakest dimension in the sample — mean ${r2(x.a)} of 5.`,
      a: x.d.action
    })),
    {
      t: 'Run the pulse at a cadence respondents can sustain',
      e: `A single sitting takes <span class="mono">${mmss(mA)}</span> and returns <span class="mono">${r0(pA)}</span> data points per respondent.`,
      a: 'A short, frequent pulse beats a long, occasional one: scope each cycle to one or two dimensions so a sitting stays under five minutes, and rotate through the five over a quarter.'
    },
    {
      t: 'Treat the within-day dip as a measurement finding, not noise',
      e: widestRange != null
        ? `Widest single-respondent range across the day: <span class="mono">${r2(widestRange)}</span> index points.`
        : 'Within-day range requires at least one completed run.',
      a: 'A flat annual number cannot show where in the day engagement is lost. Where the trace dips sharply, look at what that station describes and act on the specific moment, not the average.'
    },
    {
      t: 'Instrument the qualitative channel deliberately',
      e: `${incidents} of ${rows.length} respondent${rows.length === 1 ? '' : 's'} recorded a critical incident in their own words.`,
      a: 'Attach one open prompt to every pulse and route the responses to the manager who can act, with identity stripped. The index tells you the level; only the incident tells you the cause.'
    }
  ];
  return `<div class="card pad" style="margin-top:1.5rem">
    <p class="p-eyebrow">Recommendations · prioritised, and traced to the figures above</p>
    <p class="p-title" style="margin-bottom:.3rem">What we would tell an HR function to do with this</p>
    <p class="p-q" style="margin-bottom:.4rem">Ordered by the strength of the evidence behind them. Items 1–2 are read off the dimension profile; 3–4 from the trace and qualitative figures.</p>
    ${items.map((it, i) => `<div class="rec">
      <span class="rec-n">${String(i + 1).padStart(2, '0')}</span>
      <div><p class="rec-t">${esc(it.t)}</p><p class="rec-e">Evidence · ${it.e}</p><p class="small">${esc(it.a)}</p></div>
    </div>`).join('')}
  </div>`;
}

/* ── 21 · TAB · DATA & EXPORT ──────────────────────────────────────  */
function tabData(rows) {
  const sumTable = `
    <div class="tbl-scroll">
      <table>
        <thead><tr>
          <th>Code</th><th>Programme</th><th>Sector</th><th>Mos.</th>
          <th>Index</th><th>/100</th><th>Self 0–10</th>
          <th>Time</th><th>Revis.</th><th>Points</th><th></th>
        </tr></thead>
        <tbody>
          ${rows.map(r => `<tr>
            <td class="k">${esc(r.code)}${r.testRun ? ' <span class="tiny">pilot</span>' : ''}</td>
            <td style="text-align:left">${esc(progShort(r.programme))}</td>
            <td style="text-align:left" class="tiny">${esc(r.bio.industry || '—')}</td>
            <td>${r.bio.months ?? '—'}</td>
            <td>${r2(r.sim)}</td>
            <td>${r0(r.sim100)}</td>
            <td>${r.anchor ?? '—'}</td>
            <td>${mmss(r.simSecs)}</td>
            <td>${r.revisions ?? '—'}</td><td>${r.points}</td>
            <td><button class="ghost" data-del="${esc(r.id)}" style="font-size:.62rem">Remove</button></td>
          </tr>`).join('') || `<tr><td colspan="11" style="text-align:center; padding:1.5rem">No runs stored yet.</td></tr>`}
        </tbody>
      </table>
    </div>`;

  const itemTable = !rows.length ? '' : `
    <div class="tbl-scroll">
      <table>
        <thead><tr><th>Station</th><th>Time</th><th>Dimension</th>
          ${rows.map(r => `<th>${esc(r.code)} raw</th><th>${esc(r.code)} 1–5</th><th>${esc(r.code)} ms</th>`).join('')}
        </tr></thead>
        <tbody>
          ${STATIONS.map((s, i) => `<tr>
            <td class="k">${String(i + 1).padStart(2, '0')}</td><td>${esc(s.t)}</td>
            <td style="text-align:left" class="tiny">${DIM[s.dim].k} ${esc(DIM[s.dim].name)}</td>
            ${rows.map(r => { const a = (r.answers || [])[i];
              return `<td>${a ? a.value : '—'}</td><td>${a ? r2(rescale4to5(a.value)) : '—'}</td><td>${a && a.ms ? a.ms : '—'}</td>`; }).join('')}
          </tr>`).join('')}
        </tbody>
      </table>
    </div>`;

  return `
    <div class="panel panel-full" style="margin-bottom:1.25rem">
      <p class="p-eyebrow">Dataset</p>
      <p class="p-title">One row per respondent</p>
      ${sumTable}
      <div class="btn-row" style="margin-top:1rem">
        <button class="btn btn-2 btn-sm" id="csvSum">Export summary CSV</button>
        <button class="btn btn-2 btn-sm" id="csvItems">Export item-level CSV</button>
        <button class="btn btn-2 btn-sm" id="csvJson">Export full JSON</button>
        <span class="tiny" id="expMsg"></span>
      </div>
      <p class="p-note">Exports respect the pilot-run filter above. If a file save is not available in
      this view, the same content is copied to your clipboard instead — paste it into a
      <span class="mono">.csv</span> file.</p>
    </div>

    <div class="panel panel-full" style="margin-bottom:1.25rem">
      <p class="p-eyebrow">Item level</p>
      <p class="p-title">Every station, per respondent</p>
      <p class="p-q">Raw choices are 1–4 and rescaled to 1–5 as <span class="mono">1 + (raw − 1) × 4/3</span>.</p>
      ${itemTable || emptyFig('No responses stored yet.')}
    </div>

    <div class="panel panel-full">
      <p class="p-eyebrow">Add a respondent</p>
      <p class="p-title">Paste a result code</p>
      <p class="p-q">If a respondent completed the study on a device that could not reach the store,
      they were given a result code. Paste it here to add their run.</p>
      <textarea id="impBox" placeholder="Paste the result code…" style="margin-top:.7rem"></textarea>
      <div class="btn-row" style="margin-top:.7rem">
        <button class="btn btn-2 btn-sm" id="impGo">Import respondent</button>
        <span class="tiny" id="impMsg"></span>
      </div>
    </div>`;
}

/* ── 22 · TAB · QUALITATIVE ────────────────────────────────────────  */
function tabQual(rows) {
  const withText = rows.filter(r => r.incident || r.probeA);
  return `
    <div class="panel panel-full">
      <p class="p-eyebrow">Qualitative capture</p>
      <p class="p-title">The material a numeric index alone can't carry</p>
      <p class="p-q">Alongside the twelve station choices, the simulation recorded a critical incident
      in the respondent's own words, an AI-generated follow-up written for their specific answer
      pattern, and two behavioural outcome items.</p>
      ${!withText.length ? emptyFig('No free-text responses stored yet.') : withText.map(r => `
        <div style="border-top:1px solid var(--rule); padding:1.1rem 0">
          <div class="row wrap" style="gap:.6rem; margin-bottom:.6rem">
            <span class="chip" aria-pressed="true">${esc(r.code)} · ${esc(progShort(r.programme))}</span>
            <span class="tiny mono">index ${r2(r.sim)} · self ${r.anchor ?? '—'}/10</span>
            <span class="tiny mono">would stay: ${esc(r.stay || '—')} · would recommend: ${esc(r.recommend || '—')}</span>
          </div>
          ${r.incident ? `<p class="eyebrow" style="margin-bottom:.25rem">Critical incident</p>
            <p style="font-size:1.02rem; margin-bottom:.8rem">“${esc(r.incident)}”</p>` : ''}
          ${r.probeQ ? `<p class="eyebrow" style="margin-bottom:.25rem">Adaptive probe · generated for this respondent</p>
            <p class="small" style="color:var(--ink)"><strong>${esc(r.probeQ)}</strong></p>
            <p style="font-size:1.02rem; margin-top:.3rem">${r.probeA ? '“' + esc(r.probeA) + '”' : '<span class="tiny">Not answered.</span>'}</p>` : ''}
        </div>`).join('')}
      <p class="p-note">Read against the numbers, this is the argument for real-time measurement in
      miniature: the index tells you the level, the incident tells you the cause.</p>
    </div>`;
}

/* ── 23 · TAB WIRING & EXPORT ──────────────────────────────────────  */
function wireTab(rows) {
  stage.querySelectorAll('[data-dim]').forEach(c => c.onclick = () => { AV.dimSel = c.dataset.dim; renderAnalysis(); });
  stage.querySelectorAll('[data-trace]').forEach(c => c.onclick = () => { AV.traceSel = c.dataset.trace; renderAnalysis(); });
  stage.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    const id = b.dataset.del;
    const row = rows.find(r => r.id === id);
    if (!confirm(`Remove respondent ${row ? row.code : id} from the dataset? This deletes the run from this browser and, if connected, from the store. It cannot be undone.`)) return;
    store.set(K_RUNS, localRuns().filter(r => r.id !== id));
    if (DB) { try { await DB.collection('runs').doc(id).delete(); } catch (e) {} }
    dbRuns = dbRuns.filter(r => r.id !== id);
    renderAnalysis();
  });
  const sum = document.getElementById('csvSum');
  if (sum) sum.onclick = () => deliver('shift-signal-summary.csv', csvSummary(rows), 'expMsg');
  const it = document.getElementById('csvItems');
  if (it) it.onclick = () => deliver('shift-signal-items.csv', csvItems(rows), 'expMsg');
  const js = document.getElementById('csvJson');
  if (js) js.onclick = () => deliver('shift-signal-runs.json', JSON.stringify(allRuns().filter(r => AV.pilots || !r.testRun), null, 2), 'expMsg');
  const imp = document.getElementById('impGo');
  if (imp) imp.onclick = async () => {
    const msg = document.getElementById('impMsg');
    const r = decodeRun(document.getElementById('impBox').value);
    if (!r) { msg.textContent = 'That code could not be read. Copy the whole block, with nothing added.'; return; }
    if (allRuns().some(x => x.id === r.id)) { msg.textContent = 'That respondent is already in the dataset.'; return; }
    r.scores = computeScores(r); r.points = dataPoints(r);
    await persist(r);
    msg.textContent = `Imported ${r.code || 'respondent'}.`;
    renderAnalysis();
  };
}

const c2 = n => n == null ? '' : (Math.round(n * 100) / 100).toFixed(2);
const c0 = n => n == null ? '' : String(Math.round(n));
const q = v => { const s = String(v == null ? '' : v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
function csvSummary(rows) {
  const head = ['respondent_code', 'programme', 'is_pilot', 'sector', 'role', 'months_experience', 'team_size',
    'completed_at', 'engagement_index_1_5', 'engagement_index_0_100', 'self_rating_0_10',
    ...DIMS.map(d => d.id),
    'seconds_on_task', 'answer_revisions', 'median_latency_ms', 'data_points',
    'would_stay', 'would_recommend',
    'critical_incident', 'adaptive_probe_question', 'adaptive_probe_answer'];
  const lines = rows.map(r => [r.code, r.programme, r.testRun ? 'yes' : 'no', r.bio.industry, r.bio.role,
    r.bio.months, r.bio.teamSize, r.completedAt, c2(r.sim), c0(r.sim100), r.anchor,
    ...DIMS.map(d => c2(r.simDims[d.id])),
    r.simSecs, r.revisions, r.medianLatency, r.points,
    r.stay, r.recommend, r.incident, r.probeQ, r.probeA].map(q).join(','));
  return [head.join(','), ...lines].join('\n');
}
function csvItems(rows) {
  const head = ['respondent_code', 'programme', 'station_id', 'station_time', 'dimension',
    'item_text', 'chosen_text', 'raw_score', 'scaled_1_5', 'latency_ms', 'revisions'];
  const out = [];
  rows.forEach(r => {
    STATIONS.forEach((s, i) => {
      const a = (r.answers || [])[i];
      const chosen = a ? (s.opts.find(o => o.v === a.value) || {}).t : '';
      out.push([r.code, r.programme, String(i + 1).padStart(2, '0'), s.t,
        DIM[s.dim].name, s.prompt, chosen, a ? a.value : '',
        a ? c2(rescale4to5(a.value)) : '', a ? a.ms : '', a ? a.revisions : ''].map(q).join(','));
    });
  });
  return [head.join(','), ...out].join('\n');
}
async function deliver(filename, text, msgId) {
  const msg = document.getElementById(msgId);
  if (DL) {
    try {
      const res = await DL.save({ filename, data: text });
      msg.textContent = res && res.status === 'saved' ? `Saved ${filename}.` : `${filename} handed to your device.`;
      return;
    } catch (e) {
      if (e && e.code === 'cancelled') { msg.textContent = 'Save cancelled.'; return; }
    }
  }
  try { await navigator.clipboard.writeText(text); msg.textContent = `Copied ${filename} to the clipboard — paste it into a file.`; }
  catch (e) { msg.textContent = 'Could not save or copy here. Use “Export full JSON” from a desktop browser.'; }
}

/* ── 24 · BOOT & ROUTING ───────────────────────────────────────────  */
function resumeScreen() {
  if (!run || !run.consent) return renderLanding();
  if (run.completedAt) { run = null; store.del(K_RUN); return renderLanding(); }
  if (run.a.startedAt) {
    const nextIx = run.a.answers.findIndex(a => !a);
    if (nextIx === -1) return renderSimExtras();
    stationIx = Math.max(0, nextIx);
    return renderStation();
  }
  return renderSimIntro();
}
function boot() {
  if (location.hash.startsWith('#/analysis')) return renderAnalysis();
  if (location.hash.startsWith('#/methods')) return renderMethods();
  const partial = store.get(K_RUN, null);
  run = partial && partial.a && partial.b ? partial : null;
  if (run) return resumeScreen();
  renderLanding();
}
window.addEventListener('hashchange', boot);
window.addEventListener('scroll', hideTip, { passive: true });
boot();
initCaps();
</script>
