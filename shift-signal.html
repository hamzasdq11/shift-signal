<style>
/* ─────────────────────────────────────────────────────────────
   SHIFT SIGNAL — engagement measurement instrument
   Tokens: light palette on bare :root, redefined for both
   dark states. Every colour comes from a token.
   Series hue validated (CVD/chroma/lightness/contrast) for both
   surfaces: #00897B / #2FA89A
   ───────────────────────────────────────────────────────────── */
:root {
  color-scheme: light;
  --ground:    #F1F2EC;
  --surface:   #FBFBF7;
  --sunk:      #E3E7DA;

  --ink-2:     #4C5D59;
  --ink-3:     #55655F;
  --rule:      #D7DBCD;

  --a-ink:     #006056;

  --good:      #0ca30c;
  --warn:      #fab219;
  --crit:      #d03b3b;
  --on-a:      #FFFFFF;
  --grid:      rgba(14,27,26,.09);
  --shadow:    0 1px 0 rgba(14,27,26,.03), 0 14px 34px -26px rgba(14,27,26,.55);
  --dash:      rgba(14,27,26,.22);

  --ff-d: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --ff-b: "Newsreader", Georgia, "Times New Roman", serif;
  --ff-m: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground:    #0A1413;
    --surface:   #111E1D;
    --sunk:      #0D1918;
    --ink:       #E8EDE6;
    --ink-2:     #9FB0AB;
    --ink-3:     #879992;
    --rule:      #23332F;
    --rule-2:    #2E4340;
    --a:         #2FA89A;
    --a-ink:     #7FCFC4;
    --a-soft:    rgba(47,168,154,.15);
    --on-a:      #04201D;
    --grid:      rgba(232,237,230,.10);
    --shadow:    0 1px 0 rgba(0,0,0,.2), 0 14px 34px -26px rgba(0,0,0,.9);
    --dash:      rgba(232,237,230,.24);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground:    #0A1413;
  --surface:   #111E1D;
  --sunk:      #0D1918;
  --ink:       #E8EDE6;
  --ink-2:     #9FB0AB;
  --ink-3:     #879992;
  --rule:      #23332F;
  --rule-2:    #2E4340;
  --a:         #2FA89A;
  --a-ink:     #7FCFC4;
  --a-soft:    rgba(47,168,154,.15);
  --b:         #BD8817;
  --b-ink:     #E0B052;
  --b-soft:    rgba(189,136,23,.16);

  --grid:      rgba(232,237,230,.10);
  --shadow:    0 1px 0 rgba(0,0,0,.2), 0 14px 34px -26px rgba(0,0,0,.9);
  --dash:      rgba(232,237,230,.24);
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--ff-b);
  font-size: 17px;
  line-height: 1.62;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { font-family: var(--ff-d); font-weight: 600; line-height: 1.14; margin: 0; text-wrap: balance; letter-spacing: -.015em; }
h1 { font-size: clamp(2rem, 5.4vw, 3.05rem); font-weight: 700; letter-spacing: -.03em; }
h2 { font-size: clamp(1.35rem, 3.2vw, 1.75rem); }
h3 { font-size: 1.12rem; }
h4 { font-size: .95rem; }
p { margin: 0; }
a { color: var(--a-ink); text-decoration-thickness: 1px; text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--a); outline-offset: 3px; border-radius: 2px; }
::selection { background: var(--a-soft); }

.mono { font-family: var(--ff-m); font-variant-numeric: tabular-nums; }
.eyebrow {

}
.lede { font-size: 1.12rem; color: var(--ink-2); max-width: 62ch; }
.small { font-size: .875rem; color: var(--ink-2); }

.stack { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; }
.wrap { flex-wrap: wrap; }

/* ── shell ───────────────────────────────────────────────── */
#app { min-height: 100vh; display: flex; flex-direction: column; }
#stage { flex: 1; }
.col { width: 100%; max-width: 42rem; margin: 0 auto; padding: 0 1.25rem; }
.col-wide { width: 100%; max-width: 76rem; margin: 0 auto; padding: 0 1.25rem; }

/* ── instrument bar ──────────────────────────────────────── */
.rig {
  position: sticky; top: 0; z-index: 40;
  background: color-mix(in srgb, var(--ground) 88%, transparent);
  backdrop-filter: blur(9px);
  border-bottom: 1px solid var(--rule);
}
.rig-in {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center; gap: 1rem; height: 3.5rem;
}
.rig-in > * { min-width: 0; }
.brand { font-family: var(--ff-d); font-weight: 700; font-size: .875rem; letter-spacing: -.01em; display: flex; align-items: center; gap: .5rem; }
.brand-dot { width: .5rem; height: .5rem; border-radius: 50%; background: var(--a); box-shadow: 0 0 0 3px var(--a-soft); flex: none; }
.rig-mid { display: flex; align-items: center; gap: .75rem; min-width: 0; justify-content: center; }
.trace-box { width: min(15rem, 34vw); height: 1.75rem; display: block; }
.clock {
  font-family: var(--ff-m); font-size: .8rem; font-weight: 500; font-variant-numeric: tabular-nums;
  color: var(--ink-2); background: var(--surface); border: 1px solid var(--rule);

  .rig-in { gap: .6rem; }

  .ghost { font-size: .66rem; padding: .28rem .4rem; }
}
.rig-right { display: flex; align-items: center; gap: .6rem; }
.pips { display: flex; gap: 3px; }
.pip { width: 6px; height: 14px; border-radius: 1px; background: var(--rule-2); }
.pip.on { background: var(--a); }
.pip.now { background: var(--ink); }
.ghost {
  font-family: var(--ff-m); font-size: .72rem; letter-spacing: .06em; text-transform: uppercase;
  background: none; border: 1px solid var(--rule-2); color: var(--ink-2);
  padding: .3rem .55rem; border-radius: 3px; cursor: pointer;
}

/* ── buttons ─────────────────────────────────────────────── */
.btn {
  font-family: var(--ff-d); font-weight: 600; font-size: .92rem;
  background: var(--a); color: var(--on-a); border: 1px solid var(--a);
  padding: .68rem 1.35rem; border-radius: 3px; cursor: pointer;
  display: inline-flex; align-items: center; gap: .55rem; transition: filter .14s ease;
}
.btn:hover { filter: brightness(1.08); }

.btn-2 { background: none; color: var(--ink); border-color: var(--rule-2); }
.btn-2:hover { border-color: var(--ink-3); filter: none; }
.btn-sm { padding: .42rem .8rem; font-size: .82rem; }
.btn-row { display: flex; gap: .7rem; align-items: center; flex-wrap: wrap; }

/* ── cards ───────────────────────────────────────────────── */
.card {
  background: var(--surface); border: 1px solid var(--rule);
  border-radius: 4px; box-shadow: var(--shadow);
}
.pad { padding: clamp(1.1rem, 3vw, 1.65rem); }
.hr { height: 1px; background: var(--rule); border: 0; margin: 0; }

/* ── landing ─────────────────────────────────────────────── */
.hero { padding: clamp(2.5rem, 8vw, 5rem) 0 2.25rem; }
.hero-mark {
  display: flex; align-items: flex-end; gap: .1rem; height: 4.5rem; margin-bottom: 1.75rem;
}
.hero-mark span {
  width: 5px; background: var(--a); border-radius: 2px 2px 0 0;
  animation: breathe 3.4s ease-in-out infinite;
}
@keyframes breathe { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(.44); } }
@media (prefers-reduced-motion: reduce) { .hero-mark span { animation: none; } }
.dim-k { font-family: var(--ff-m); font-size: .78rem; color: var(--a); font-weight: 600; }
.dim-n { font-family: var(--ff-d); font-weight: 600; font-size: .95rem; }

/* ── forms ───────────────────────────────────────────────── */
label.fld { display: flex; flex-direction: column; gap: .3rem; }
.fld-l { font-family: var(--ff-m); font-size: .72rem; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); }

  background: var(--sunk); border: 1px solid var(--rule-2); border-radius: 3px;
  padding: .58rem .7rem; width: 100%;
}

.check { display: flex; gap: .7rem; align-items: flex-start; font-size: .92rem; color: var(--ink-2); cursor: pointer; }
.check input { margin-top: .35rem; accent-color: var(--a); width: 1rem; height: 1rem; flex: none; }
.seg { display: flex; gap: 0; border: 1px solid var(--rule-2); border-radius: 3px; overflow: hidden; }

}

/* ── station (mode A) ────────────────────────────────────── */
.station { display: grid; grid-template-columns: 4.25rem 1fr; gap: 0; padding: 2rem 0 1rem; }

.rail { position: relative; padding-top: .2rem; }

.rail-i { font-family: var(--ff-m); font-size: .68rem; color: var(--ink-3); margin-top: .1rem; }
.rail-line { position: absolute; left: .2rem; top: 3rem; bottom: -1rem; width: 1px; background: var(--rule); }

.st-tag { display: inline-flex; align-items: center; gap: .45rem; margin-bottom: .8rem; }
.st-tag i { width: .42rem; height: .42rem; background: var(--a); border-radius: 50%; display: block; }
.scene { font-size: 1.16rem; line-height: 1.58; margin-bottom: .35rem; }

.prompt { font-family: var(--ff-d); font-weight: 600; font-size: .95rem; margin: 1.05rem 0 .7rem; }
.opts { display: flex; flex-direction: column; gap: .45rem; }
.opt {
  display: grid; grid-template-columns: 1.5rem 1fr; gap: .7rem; align-items: start;
  text-align: left; font-family: var(--ff-b); font-size: 1rem; line-height: 1.45;
  background: var(--surface); color: var(--ink); border: 1px solid var(--rule);
  border-radius: 3px; padding: .72rem .85rem; cursor: pointer;
  transition: border-color .12s ease, background .12s ease;
}
.opt:hover { border-color: var(--ink-3); }
.opt-k { font-family: var(--ff-m); font-size: .72rem; font-weight: 500; color: var(--ink-3); background: var(--sunk); border-radius: 2px; text-align: center; padding: .12rem 0; margin-top: .18rem; }
.opt[aria-pressed="true"] { border-color: var(--a); background: var(--a-soft); box-shadow: inset 0 0 0 1px var(--a); }
.opt[aria-pressed="true"] .opt-k { background: var(--a); color: var(--on-a); }
.st-foot { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-top: 1.25rem; flex-wrap: wrap; }

/* ── slider ──────────────────────────────────────────────── */
input[type="range"] { width: 100%; accent-color: var(--a); height: 1.75rem; }
.tick-row { display: flex; justify-content: space-between; font-family: var(--ff-m); font-size: .68rem; color: var(--ink-3); }

/* ── receipt / scores ────────────────────────────────────── */
.score-solo { background: var(--surface); border: 1px solid var(--rule); border-top: 3px solid var(--a); border-radius: 4px; padding: 1.1rem 1.15rem; }
.score-big { font-family: var(--ff-m); font-size: 2.5rem; font-weight: 500; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1; }
.score-big { color: var(--ink); }
.score-of { font-family: var(--ff-m); font-size: .8rem; color: var(--ink-3); }
.band { display: inline-flex; align-items: center; gap: .35rem; font-family: var(--ff-m); font-size: .72rem; letter-spacing: .04em; text-transform: uppercase; padding: .2rem .45rem; border-radius: 2px; border: 1px solid var(--rule-2); color: var(--ink-2); }
.band svg { width: .8rem; height: .8rem; flex: none; }
.band.g { color: var(--good); border-color: color-mix(in srgb, var(--good) 45%, transparent); }
.band.w { color: var(--ink-2); border-color: color-mix(in srgb, var(--warn) 60%, transparent); }
.band.c { color: var(--crit); border-color: color-mix(in srgb, var(--crit) 45%, transparent); }
.code-box {
  font-family: var(--ff-m); font-size: .74rem; line-height: 1.5; word-break: break-all;
  background: var(--sunk); border: 1px solid var(--rule-2); border-radius: 3px;
  padding: .7rem; max-height: 9rem; overflow: auto; color: var(--ink-2); white-space: pre-wrap;
}

/* ── analyst view ────────────────────────────────────────── */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: 4px; overflow: hidden; }
.kpi { background: var(--surface); padding: .9rem 1rem; display: flex; flex-direction: column; gap: .18rem; }
.kpi-v { font-family: var(--ff-m); font-size: 1.6rem; font-weight: 500; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.1; }
.kpi-l { font-family: var(--ff-m); font-size: .66rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }

.panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(24rem, 1fr)); gap: 1.15rem; }
@media (max-width: 30rem) { .panels { grid-template-columns: 1fr; } }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 4px; padding: 1.15rem; display: flex; flex-direction: column; gap: .2rem; min-width: 0; }
.panel-full { grid-column: 1 / -1; }
.p-eyebrow { font-family: var(--ff-m); font-size: .66rem; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
.p-title { font-family: var(--ff-d); font-weight: 600; font-size: 1.02rem; letter-spacing: -.01em; }
.p-q { font-size: .88rem; color: var(--ink-2); margin-top: .1rem; }
.p-note { font-size: .8rem; color: var(--ink-2); border-top: 1px dashed var(--rule-2); padding-top: .6rem; margin-top: .5rem; }
.legend { display: flex; gap: .9rem; flex-wrap: wrap; margin: .7rem 0 .2rem; }
.lg { display: inline-flex; align-items: center; gap: .38rem; font-family: var(--ff-m); font-size: .72rem; color: var(--ink-2); }
.sw { width: .7rem; height: .7rem; border-radius: 2px; flex: none; }
.sw.a { background: var(--a); }
figure { margin: 0; }
.viz { width: 100%; height: auto; display: block; overflow: visible; }
.viz text { font-family: var(--ff-m); font-variant-numeric: tabular-nums; }
.tbl-scroll { overflow-x: auto; margin: 0 -1.15rem; padding: 0 1.15rem; }
table { border-collapse: collapse; width: 100%; font-size: .84rem; }
th, td { text-align: right; padding: .45rem .55rem; border-bottom: 1px solid var(--rule); white-space: nowrap; }
th { font-family: var(--ff-m); font-size: .66rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; border-bottom: 1px solid var(--rule-2); }
td { font-family: var(--ff-m); font-variant-numeric: tabular-nums; color: var(--ink-2); }
th:first-child, td:first-child { text-align: left; }
td.k { color: var(--ink); font-weight: 500; }
tr.tot td { border-top: 1px solid var(--rule-2); border-bottom: 0; color: var(--ink); }
.empty { border: 1px dashed var(--rule-2); border-radius: 4px; padding: 2rem 1.25rem; text-align: center; color: var(--ink-2); }
.tabs { display: flex; gap: .4rem; border-bottom: 1px solid var(--rule); margin-bottom: 1.25rem; flex-wrap: wrap; }
.tab { font-family: var(--ff-m); font-size: .76rem; letter-spacing: .06em; text-transform: uppercase; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--ink-3); padding: .55rem .3rem; cursor: pointer; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--a); }
.chips { display: flex; gap: .35rem; flex-wrap: wrap; }
.chip { font-family: var(--ff-m); font-size: .7rem; background: var(--sunk); border: 1px solid var(--rule-2); color: var(--ink-2); border-radius: 999px; padding: .18rem .55rem; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--a); border-color: var(--a); color: var(--on-a); }

/* ── misc ────────────────────────────────────────────────── */
.tip {
  position: fixed; z-index: 90; pointer-events: none; opacity: 0;
  background: var(--ink); color: var(--ground); font-family: var(--ff-m); font-size: .72rem;
  line-height: 1.45; padding: .4rem .55rem; border-radius: 3px; max-width: 15rem;
  transition: opacity .1s ease; box-shadow: 0 6px 18px -8px rgba(0,0,0,.5);

@media (prefers-reduced-motion: reduce) { .fade { animation: none; } }
.sr {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}

<div id="app">
  <header class="rig" id="rig" hidden>
    <div class="col-wide rig-in">
      <div class="brand"><span class="brand-dot"></span><span class="brand-word">Shift Signal</span></div>
      <div class="rig-mid" id="rigMid"></div>
      <div class="rig-right" id="rigRight"></div>
    </div>
  </header>
  <main id="stage"></main>
  <footer class="foot">
    <div class="col-wide foot-in">
      <p class="tiny">Shift Signal · engagement measurement instrument · IIM Ranchi · Introduction to HRM, Term VII</p>
      <p class="tiny"><a href="#/methods">Instrument design</a> · <a href="#/analysis">Researcher view</a></p>
    </div>
  </footer>
</div>
<div class="tip" id="tip" role="status" aria-live="polite"></div>

<script>
/* ═══════════════════════════════════════════════════════════════════
   SHIFT SIGNAL
   An engagement-measurement instrument: a scenario simulation walking
   the respondent through one retrospective workday at a former
   employer, scored onto a 1–5 engagement index.
   ═══════════════════════════════════════════════════════════════════ */

/* ── 1 · CONSTRUCT ─────────────────────────────────────────────────
   Engagement = the investment of the self in a work role (Kahn, 1990),
   expressed as vigour, dedication and absorption (Schaufeli et al.,
   2002) and made possible by job resources (Bakker & Demerouti, 2007).
   Five dimensions, spanning Kahn's three psychological conditions.   */
const DIMS = [
  { k: 'D1', id: 'clarity',     name: 'Role Clarity & Resources', theory: 'Kahn: psychological availability · JD-R: job resources',
    why: 'Knowing what the work is, and having the means to do it, is the precondition for investing effort at all.',
    op: 'Two stations put the respondent at the start of a day, then in front of a deadline needing access they may not have. The choice reports whether expectations and resources were actually present, rather than asking them to rate clarity in the abstract.',
    action: 'Publish a one-page "what done looks like" for every role and refresh it at each quarter boundary. Audit tooling and system access at onboarding rather than through tickets afterwards.' },
  { k: 'D2', id: 'recognition', name: 'Recognition & Being Valued', theory: 'Kahn: meaningfulness & safety',
    why: 'Effort that is seen and valued returns as meaningfulness; unseen effort is withdrawn.',
    op: 'One station follows a genuinely hard delivery into the week after it shipped; one puts a personal emergency against an unfinished deadline. Both surface recognition and regard as observable events, not sentiments.',
    action: 'Require specific, named recognition within seven days of a delivery, and track it as a manager behaviour, not only as an employee feeling.' },
  { k: 'D3', id: 'growth',      name: 'Growth & Progress', theory: 'JD-R: developmental resources · UWES: dedication',
    why: 'A forward path converts a job into a trajectory, sustaining dedication over time.',
    op: 'Three stations cover a stretch opportunity, the last progress conversation, and a year-end retrospective on skill. Together they separate development that happened from development that was merely available.',
    action: 'Diarise a dated progress conversation twice a year for every reportee, held separately from appraisal, closing on one written development commitment.' },
  { k: 'D4', id: 'voice',       name: 'Voice & Team Trust', theory: 'Kahn: psychological safety',
    why: 'People invest themselves only where it is safe to speak and where others hold the standard.',
    op: 'Three stations ask what the respondent did — spoke up or stayed quiet, where lunch was actually spent, what quality arrived from colleagues — capturing behaviour rather than a claim about the climate.',
    action: 'Close the loop visibly: record the decision and the reason for every point raised in a review. Voice that is heard and never acted on reads to the person as no voice at all.' },
  { k: 'D5', id: 'meaning',     name: 'Meaning & Strengths Use', theory: 'Kahn: psychological meaningfulness · UWES: absorption',
    why: 'Work that draws on what you are good at, for a purpose you accept, is what absorbs you.',
    op: 'One station allocates the week\'s work against the respondent\'s strengths; one asks what they would honestly have told a friend about what the organisation was for. The second is the sharpest test of stated against felt purpose.',
    action: 'Make the line from individual task to organisational purpose explicit at goal-setting, and re-cut assignments so strengths are engaged in at least half of a person\'s week.' }
];
const DIM = Object.fromEntries(DIMS.map(d => [d.id, d]));

/* ── 2 · THE SIMULATION ─────────────────────────────────────────────
   One retrospective workday at the respondent's previous employer,
   12 stations across the five dimensions above. Options are ordered
   4→1 in the source and shuffled at render. Raw 1–4 is rescaled to
   1–5: s = 1 + (raw − 1) × 4/3.                                      */
const STATIONS = [
  { t: '09:10', dim: 'clarity',
    scene: 'A normal Tuesday at your last job. Laptop open, coffee down, inbox loading. You have roughly an hour before the day takes over.',
    prompt: 'How did that first hour usually go?',
    opts: [
      { v: 4, t: 'I knew exactly what mattered that day and what "done" would look like.' },
      { v: 3, t: 'I knew my tasks, though priorities shifted under me without much warning.' },
      { v: 2, t: 'I had to chase someone before I could tell what actually mattered.' },
      { v: 1, t: 'I worked on whatever looked urgent and hoped it was the right thing.' } ] },

  { t: '09:45', dim: 'clarity',
    scene: 'A deadline lands for end of day. To deliver it properly you need one system, one approval, and one file that lives on somebody else’s drive.',
    prompt: 'What happened next?',
    opts: [
      { v: 4, t: 'Access, tools and permissions were already in place. I just did the work.' },
      { v: 3, t: 'Minor friction, and a workaround I already knew by heart.' },
      { v: 2, t: 'Half the day went on raising tickets and chasing people for access.' },
      { v: 1, t: 'The tools were poor enough that doing it properly was not possible.' } ] },

  { t: '11:00', dim: 'meaning',
    scene: 'Your manager redistributes the week’s work in the standup. You listen for which slice is yours.',
    prompt: 'The work you were handed, week after week, mostly...',
    opts: [
      { v: 4, t: 'Played straight to what I was genuinely good at.' },
      { v: 3, t: 'Used some of my strengths, padded out with filler.' },
      { v: 2, t: 'Could have been done by anyone. My strengths sat idle.' },
      { v: 1, t: 'Was mismatched to me. I was weakest at exactly what the job required.' } ] },

  { t: '11:40', dim: 'voice',
    scene: 'Mid-morning review. Halfway through the deck you spot a flaw in the plan that nobody has named. Two people senior to you are in the room.',
    prompt: 'What did you actually do, in that job?',
    opts: [
      { v: 4, t: 'Said it plainly. That was normal there, and it changed the plan.' },
      { v: 3, t: 'Said it. It was heard politely and then not acted on.' },
      { v: 2, t: 'Kept it for a private word afterwards, not for the room.' },
      { v: 1, t: 'Said nothing. Speaking up cost more than it was ever worth.' } ] },

  { t: '12:30', dim: 'recognition',
    scene: 'You ship the piece of work that was genuinely hard — the one you stayed late for twice.',
    prompt: 'Over the week that followed...',
    opts: [
      { v: 4, t: 'Someone who mattered named it specifically, and said what was good about it.' },
      { v: 3, t: 'A quick thanks in passing, and on to the next thing.' },
      { v: 2, t: 'Nothing was said. The work was absorbed silently.' },
      { v: 1, t: 'It went unnoticed, and the next ask arrived instead.' } ] },

  { t: '13:15', dim: 'voice',
    scene: 'Lunch. Nobody has organised anything, so where you eat is entirely your own habit.',
    prompt: 'Where did that hour actually go?',
    opts: [
      { v: 4, t: 'With people I would call friends. We talked about more than work.' },
      { v: 3, t: 'With colleagues — cordial, mostly shop talk.' },
      { v: 2, t: 'At my desk with the screen still on.' },
      { v: 1, t: 'Alone, deliberately. The team took more out of me than it gave.' } ] },

  { t: '14:20', dim: 'growth',
    scene: 'A stretch project opens up — the kind of work that sits one level above your title.',
    prompt: 'How did that tend to resolve for you?',
    opts: [
      { v: 4, t: 'Someone senior put me forward and then backed me publicly.' },
      { v: 3, t: 'I could have raised my hand. Nobody pushed me either way.' },
      { v: 2, t: 'It went to someone else and was never discussed with me.' },
      { v: 1, t: 'I was told, in so many words, to stay in my lane.' } ] },

  { t: '15:00', dim: 'voice',
    scene: 'A colleague moves teams and you inherit their half-finished handover.',
    prompt: 'What you inherited from people around you was typically...',
    opts: [
      { v: 4, t: 'Rigorous. I could build straight on top of it.' },
      { v: 3, t: 'Solid enough, with a few gaps to close.' },
      { v: 2, t: 'Rushed. I redid a fair amount of it.' },
      { v: 1, t: 'So far below standard that repairing others’ work became my job.' } ] },

  { t: '15:50', dim: 'recognition',
    scene: 'At ten to four a personal emergency lands on your phone. You need to leave, and the day is not finished.',
    prompt: 'You tell your manager. The response was...',
    opts: [
      { v: 4, t: 'Person first — go, we will cover it.' },
      { v: 3, t: 'Supportive, once we had sorted out who would cover the work.' },
      { v: 2, t: 'Reluctant permission, with a reminder about the deadline.' },
      { v: 1, t: 'I would not have told them. It was not that kind of place.' } ] },

  { t: '16:40', dim: 'meaning',
    scene: 'Late afternoon, energy low. A friend messages to ask what your company is actually for — and whether your part of it matters.',
    prompt: 'Honestly, what would you have typed back?',
    opts: [
      { v: 4, t: 'I believed in it, and I could show exactly how my work served it.' },
      { v: 3, t: 'I believed in the purpose. My own link to it was indirect.' },
      { v: 2, t: 'I could recite the mission, but I did not feel it.' },
      { v: 1, t: 'The stated purpose and the daily reality contradicted each other.' } ] },

  { t: '17:30', dim: 'growth',
    scene: 'The calendar reminder for your review cycle pops up and you try to remember the last one.',
    prompt: 'When had someone last talked to you about your progress?',
    opts: [
      { v: 4, t: 'Within the last few months — a real conversation, specific and forward-looking.' },
      { v: 3, t: 'At the annual appraisal, and it was genuinely useful.' },
      { v: 2, t: 'At the annual appraisal. A form was filled in and forgotten.' },
      { v: 1, t: 'Nobody had discussed my progress with me at all.' } ] },

  { t: '18:40', dim: 'growth',
    scene: 'You shut the laptop and walk out. On the way home you think back over the whole year at that job.',
    prompt: 'Across that year...',
    opts: [
      { v: 4, t: 'I ended it measurably better at my craft, and the job is what did that.' },
      { v: 3, t: 'I learned real things, mostly on my own initiative.' },
      { v: 2, t: 'I repeated the previous year under a different label.' },
      { v: 1, t: 'I got slower. The role took skills away from me.' } ] }
];

const REFS = [
  'Bakker, A. B., &amp; Demerouti, E. (2007). The job demands–resources model: State of the art. <em>Journal of Managerial Psychology, 22</em>(3), 309–328. https://doi.org/10.1108/02683940710733115',
  'Harter, J. K., Schmidt, F. L., &amp; Hayes, T. L. (2002). Business-unit-level relationship between employee satisfaction, employee engagement, and business outcomes: A meta-analysis. <em>Journal of Applied Psychology, 87</em>(2), 268–279. https://doi.org/10.1037/0021-9010.87.2.268',
  'Kahn, W. A. (1990). Psychological conditions of personal engagement and disengagement at work. <em>Academy of Management Journal, 33</em>(4), 692–724. https://doi.org/10.5465/256287',
  'Macey, W. H., &amp; Schneider, B. (2008). The meaning of employee engagement. <em>Industrial and Organizational Psychology, 1</em>(1), 3–30. https://doi.org/10.1111/j.1754-9434.2007.0002.x',
  'Podsakoff, P. M., MacKenzie, S. B., Lee, J.-Y., &amp; Podsakoff, N. P. (2003). Common method biases in behavioral research. <em>Journal of Applied Psychology, 88</em>(5), 879–903. https://doi.org/10.1037/0021-9010.88.5.879',
  'Schaufeli, W. B., Salanova, M., González-Romá, V., &amp; Bakker, A. B. (2002). The measurement of engagement and burnout: A two sample confirmatory factor analytic approach. <em>Journal of Happiness Studies, 3</em>(1), 71–92. https://doi.org/10.1023/A:1015630930326'
];

const PROGRAMMES = ['MBA (Core)', 'MBA (HRM)', 'MBA (Business Analytics)'];
const INDUSTRIES = ['IT / Software', 'Consulting', 'Banking / Financial services', 'Manufacturing / Engineering',
  'FMCG / Retail', 'Healthcare / Pharma', 'Energy / Infrastructure', 'Media / Advertising',
  'Public sector / Non-profit', 'Startup (< 50 people)', 'Other'];

/* ── 4 · SCORING ───────────────────────────────────────────────────  */
const S_MIN = 1, S_MAX = 5;
const rescale4to5 = raw => 1 + (raw - 1) * (4 / 3);          /* 4→5, 3→3.667, 2→2.333, 1→1 */
const pct100 = s => ((s - S_MIN) / (S_MAX - S_MIN)) * 100;   /* 1–5 → 0–100 */
const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
const r1 = n => n == null ? '—' : (Math.round(n * 10) / 10).toFixed(1);
const r2 = n => n == null ? '—' : (Math.round(n * 100) / 100).toFixed(2);
const r0 = n => n == null ? '—' : Math.round(n).toString();

function dimMeansA(answers) {
  const out = {};
  DIMS.forEach(d => {
    const v = STATIONS.map((s, i) => s.dim === d.id ? answers[i] : null)
      .filter(x => x && x.value != null).map(x => rescale4to5(x.value));
    out[d.id] = mean(v);
  });
  return out;
}
/* The engagement index is the unweighted mean of the five dimension
   means, so each dimension counts equally. */
const indexFromDims = dm => mean(DIMS.map(d => dm[d.id]).filter(x => x != null));

function band(s) {
  if (s == null) return { cls: '', label: '—', icon: '' };
  if (s >= 4)   return { cls: 'g', label: 'Engaged',      icon: 'check' };
  if (s >= 3)   return { cls: 'w', label: 'Not engaged',  icon: 'dash'  };
  return          { cls: 'c', label: 'Actively disengaged', icon: 'alert' };
}
const ICONS = {
  check: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8.5l3.2 3.2L13 5"/></svg>',
  dash:  '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3.5 8h9"/></svg>',
  alert: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 2.5L14.5 13.5h-13L8 2.5z"/><path d="M8 6.5v3.2"/><circle cx="8" cy="11.6" r=".7" fill="currentColor" stroke="none"/></svg>'
};
const bandChip = s => { const b = band(s); return `<span class="band ${b.cls}">${ICONS[b.icon] || ''}${b.label}</span>`; };

/* ── 5 · STATE & PERSISTENCE ───────────────────────────────────────
   Every run is written to this browser first, so a refresh or a lost
   connection never costs a respondent their answers. When the store
   is reachable the finished run is also written there, which is what
   the researcher view aggregates.                                    */
const K_RUN = 'ss.run.v1', K_RUNS = 'ss.runs.v1', K_GATE = 'ss.gate.v1';
const GATE_CODE = 'IIMR-T7';

const store = {
  get(k, fb) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch (e) { return fb; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

let DB = null, DL = null, SAMPLE = null;      /* runtime capabilities, or null */
let dbState = 'pending';                       /* pending | live | off */

let run = null;         /* the run in progress */
let screen = 'landing';
let stationIx = 0;
let stationShownAt = 0;
let capsReady = false;

function newRun() {
  return {
    id: 'run-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7),
    v: 2, code: '', programme: '', testRun: false,
    bio: { industry: '', role: '', months: '', teamSize: '', since: '' },
    consent: false, createdAt: new Date().toISOString(),
    a: { answers: STATIONS.map(() => null), incident: '', probeQ: '', probeA: '', anchor: null, stay: null, recommend: null, startedAt: null, endedAt: null },
    device: { w: window.innerWidth, h: window.innerHeight, touch: 'ontouchstart' in window }
  };
}
const saveRun = () => store.set(K_RUN, run);
const localRuns = () => store.get(K_RUNS, []);

function computeScores(r) {
  const ad = dimMeansA(r.a.answers);
  const ai = indexFromDims(ad);
  const answered = r.a.answers.filter(Boolean);
  return {
    simDims: ad,
    sim: ai,
    sim100: ai == null ? null : pct100(ai),
    anchor: r.a.anchor,
    simSecs: (r.a.startedAt && r.a.endedAt) ? Math.round((r.a.endedAt - r.a.startedAt) / 1000) : null,
    revisions: answered.reduce((s, x) => s + (x.revisions || 0), 0),
    medianLatency: median(answered.map(x => x.ms).filter(Boolean)),
    trace: r.a.answers.map(x => x ? rescale4to5(x.value) : null)
  };
}
function median(a) {
  if (!a.length) return null;
  const s = [...a].sort((x, y) => x - y), m = s.length >> 1;
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
}
/* Data points captured — one choice, one latency and one revision
   count per station, plus the closing free-text and outcome items. */
function dataPoints(r) {
  const points = r.a.answers.filter(Boolean).length * 3
    + (r.a.incident ? 1 : 0) + (r.a.probeA ? 1 : 0)
    + (r.a.anchor != null ? 1 : 0) + (r.a.stay != null ? 1 : 0) + (r.a.recommend != null ? 1 : 0);
  return { points };
}

async function persist(r) {
  const runs = localRuns().filter(x => x.id !== r.id);
  runs.push(r);
  store.set(K_RUNS, runs);
  store.del(K_RUN);
  if (DB) {
    try { await DB.collection('runs').doc(r.id).set(r); return 'stored'; }
    catch (e) { return 'local'; }
  }
  return 'local';
}

/* ── 6 · CAPABILITIES ──────────────────────────────────────────────  */
async function initCaps() {
  const c = window.claude;
  if (!c || typeof c.use !== 'function') { dbState = 'off'; capsReady = true; return; }
  const [db, dl, sm] = await Promise.all([
    c.use('db').catch(() => null),
    c.use('downloads').catch(() => null),
    c.use('sample').catch(() => null)
  ]);
  DB = db; DL = dl; SAMPLE = sm;
  dbState = db ? 'live' : 'off';
  capsReady = true;
  if (screen === 'analysis') renderAnalysis();
  const badge = document.getElementById('dbBadge');
  if (badge) badge.replaceWith(dbBadgeEl());
}
function dbBadgeEl() {
  const s = document.createElement('span');
  s.id = 'dbBadge';
  s.className = 'tiny mono';
  s.textContent = dbState === 'live' ? 'Answers save to the study store' : dbState === 'pending' ? 'Checking storage…' : 'Answers save on this device';
  return s;
}

/* ── 7 · RENDER PLUMBING ───────────────────────────────────────────  */
const stage = document.getElementById('stage');
const rig = document.getElementById('rig');
const tip = document.getElementById('tip');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));

function paint(html, wide) {
  stage.innerHTML = `<div class="${wide ? 'col-wide' : 'col'} fade">${html}</div>`;
  window.scrollTo({ top: 0, behavior: 'auto' });
}
function showTip(html, x, y) {
  tip.innerHTML = html;
  tip.classList.add('on');
  const r = tip.getBoundingClientRect();
  let left = x + 12, top = y - r.height - 10;
  if (left + r.width > window.innerWidth - 8) left = x - r.width - 12;
  if (top < 8) top = y + 16;
  tip.style.left = Math.max(8, left) + 'px';
  tip.style.top = top + 'px';
}
const hideTip = () => tip.classList.remove('on');
function bindTips(root) {
  root.querySelectorAll('[data-tip]').forEach(n => {
    const show = e => showTip(n.getAttribute('data-tip'), e.clientX ?? 0, e.clientY ?? 0);
    n.addEventListener('mousemove', show);
    n.addEventListener('mouseenter', show);
    n.addEventListener('mouseleave', hideTip);
    n.addEventListener('focus', () => { const b = n.getBoundingClientRect(); showTip(n.getAttribute('data-tip'), b.left + b.width / 2, b.top); });
    n.addEventListener('blur', hideTip);
  });
}
const mmss = s => s == null ? '—' : Math.floor(s / 60) + 'm ' + String(s % 60).padStart(2, '0') + 's';

/* ── 8 · INSTRUMENT BAR ────────────────────────────────────────────
   The trace is the thesis of the instrument made visible: engagement
   as a signal that moves through a day, not one number at year's end. */
function setRig(mode) {
  if (!mode) { rig.hidden = true; return; }
  rig.hidden = false;
  const mid = document.getElementById('rigMid'), right = document.getElementById('rigRight');
  if (mode.kind === 'sim') {
    mid.innerHTML = `<span class="clock">${esc(STATIONS[Math.min(stationIx, STATIONS.length - 1)].t)}</span>${traceSVG()}`;
    right.innerHTML = `<span class="tiny mono" data-tip="Station ${stationIx + 1} of ${STATIONS.length}">${stationIx + 1}/${STATIONS.length}</span>
      <span class="pips" aria-hidden="true">${STATIONS.map((s, i) =>
        `<span class="pip ${i < stationIx ? 'on' : i === stationIx ? 'now' : ''}"></span>`).join('')}</span>`;
  } else {
    mid.innerHTML = `<span class="clock">${esc(mode.label || '')}</span>`;
    right.innerHTML = mode.right || '';
  }
  bindTips(rig);
}
function traceSVG() {
  const pts = run ? run.a.answers.map(x => x ? rescale4to5(x.value) : null) : [];
  const W = 240, H = 28, pad = 3;
  const x = i => pad + (i / (STATIONS.length - 1)) * (W - pad * 2);
  const y = v => H - pad - ((v - 1) / 4) * (H - pad * 2);
  const done = pts.map((v, i) => ({ v, i })).filter(p => p.v != null);
  const line = done.map((p, k) => `${k ? 'L' : 'M'}${x(p.i).toFixed(1)} ${y(p.v).toFixed(1)}`).join(' ');
  const last = done[done.length - 1];
  return `<svg class="trace-box" viewBox="0 0 ${W} ${H}" role="img" aria-label="Live engagement trace across the simulated workday">
    <line x1="${pad}" y1="${y(3)}" x2="${W - pad}" y2="${y(3)}" stroke="var(--grid)" stroke-width="1" stroke-dasharray="2 3"/>
    ${line ? `<path d="${line}" fill="none" stroke="var(--a)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>` : ''}
    ${last ? `<circle cx="${x(last.i).toFixed(1)}" cy="${y(last.v).toFixed(1)}" r="3" fill="var(--a)" stroke="var(--surface)" stroke-width="2"/>` : ''}
  </svg>`;
}

/* ── 9 · SCREEN · LANDING ──────────────────────────────────────────  */
function renderLanding() {
  screen = 'landing'; setRig(null);
  const bars = [30, 62, 44, 78, 55, 90, 68, 40, 84, 58, 72, 48];
  paint(`
    <section class="hero">
      <div class="hero-mark" aria-hidden="true">
        ${bars.map((h, i) => `<span style="height:${h}%;animation-delay:${(i * 0.16).toFixed(2)}s"></span>`).join('')}
      </div>
      <p class="eyebrow" style="margin-bottom:.9rem">Engagement measurement · a scenario simulation</p>
      <h1>Your last job, one working day.</h1>
      <p class="lede" style="margin-top:1.1rem">
        This study asks about the engagement you experienced at the workplace you left before
        joining your MBA — <em>not</em> about student life. You'll answer by living through a
        simulated day at that job, station by station, from clock-in to clock-out. About ten minutes.
      </p>
      <div class="btn-row" style="margin-top:1.75rem">
        <button class="btn" id="begin">Begin the study
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2.5 8h11M9 3.5L13.5 8 9 12.5"/></svg>
        </button>
        <span class="tiny">Anonymous · no names collected</span>
      </div>
    </section>

    <div class="card pad" style="border-top:3px solid var(--a)">

function shuffledOpts(st, i) {
  /* Deterministic per run + station, so a refresh keeps the same order. */
  const seedStr = (run ? run.id : 'x') + ':' + i;
  let h = 2166136261;
  for (const ch of seedStr) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
  const rnd = () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return Math.abs(h) / 2147483647 % 1; };
  const a = st.opts.map((o, k) => ({ ...o, k }));
  for (let j = a.length - 1; j > 0; j--) { const t = Math.floor(rnd() * (j + 1)); [a[j], a[t]] = [a[t], a[j]]; }
  return a;
}

/* The adaptive probe is the one genuinely AI-enabled moment in the simulation:
   one follow-up question written for this respondent's own pattern of
   answers. It degrades to nothing when sampling is unavailable. */
function mountProbe() {
  const box = document.getElementById('probeBox');
  if (!box) return;
  const wait = setInterval(() => {
    if (!capsReady) return;
    clearInterval(wait);
    if (!SAMPLE) { box.innerHTML = ''; return; }
    box.innerHTML = `
      <div class="note" style="display:flex; flex-direction:column; gap:.6rem">
        <span class="eyebrow">Adaptive probe · AI-generated</span>
        <p class="small" style="color:var(--ink)">The simulation can read the pattern in your twelve
        choices and ask you one follow-up question that a fixed questionnaire could not have asked.
        Optional.</p>
        <div class="btn-row"><button class="btn btn-2 btn-sm" id="probeGo">Ask me one question</button></div>
      </div>`;
    document.getElementById('probeGo').onclick = async () => {
      const btn = document.getElementById('probeGo');
      btn.disabled = true;
      btn.innerHTML = '<span class="spin"></span> Reading your answers…';
      const dm = dimMeansA(run.a.answers);
      const rank = DIMS.map(d => ({ n: d.name, s: dm[d.id] })).filter(x => x.s != null).sort((a, b) => a.s - b.s);
      const lines = STATIONS.map((s, i) => {
        const a = run.a.answers[i];
        if (!a) return null;
        const chosen = s.opts.find(o => o.v === a.value);
        return `${DIM[s.dim].name}: chose "${chosen ? chosen.t : ''}"`;
      }).filter(Boolean).join('\n');
      try {
        const { text } = await SAMPLE(
          `A former employee is reporting retrospectively on engagement at the job they held before ` +
          `starting an MBA. Their choices in a scenario simulation:\n${lines}\n\n` +
          `Lowest-scoring dimension: ${rank[0] ? rank[0].n : 'n/a'}. Highest: ${rank[rank.length - 1] ? rank[rank.length - 1].n : 'n/a'}.\n\n` +
          `Write exactly one open follow-up question, under 28 words, that probes the tension or ` +
          `surprise in this specific pattern. Address them as "you", past tense, about that job. ` +
          `No preamble, no quotation marks, no explanation — output the question only.`,
          { modelTier: 'quick' }
        );
        const q = (text || '').trim().split('\n').filter(Boolean).pop() || '';
        if (!q) throw new Error('empty');
        run.a.probeQ = q.slice(0, 300); saveRun();
        box.innerHTML = `
          <div class="note" style="display:flex; flex-direction:column; gap:.55rem">
            <span class="eyebrow">Adaptive probe · generated from your answers</span>
            <p style="font-size:1.06rem; color:var(--ink)">${esc(run.a.probeQ)}</p>
            <textarea id="probeA" maxlength="600" placeholder="Answer in a sentence or two, or leave it blank."></textarea>
          </div>`;
        const ta = document.getElementById('probeA');
        ta.addEventListener('input', () => { run.a.probeA = ta.value; saveRun(); });
      } catch (err) {
        box.innerHTML = `<p class="tiny">The adaptive probe is unavailable right now, so the study
          continues without it. Nothing you have answered is affected.</p>`;
      }
    };
  }, 120);
  setTimeout(() => clearInterval(wait), 12000);
}

/* ── 17 · ROWS · one flat record per completed run ─────────────────  */
function rowFromRun(r) {
  const sc = r.scores && r.scores.simDims ? r.scores : computeScores(r);
  const pts = r.points || dataPoints(r);
  return {
    id: r.id, code: r.code || '—', programme: r.programme || '—', testRun: !!r.testRun,
    bio: r.bio || {}, completedAt: r.completedAt || r.createdAt,
    sim: sc.sim, sim100: sc.sim100,
    simDims: sc.simDims,
    anchor: sc.anchor, anchor5: sc.anchor == null ? null : 1 + (sc.anchor / 10) * 4,
    simSecs: sc.simSecs,
    revisions: sc.revisions, medianLatency: sc.medianLatency, trace: sc.trace,
    points: pts.points,
    stay: r.a.stay, recommend: r.a.recommend,
    incident: r.a.incident || '', probeQ: r.a.probeQ || '', probeA: r.a.probeA || '',
    answers: r.a.answers
  };
}
const progShort = p => p.includes('HRM') ? 'HRM' : p.includes('Analytics') ? 'BA' : p.includes('Core') ? 'Core' : '—';

   Shared conventions: recessive grid, thin marks, direct value labels,
   all text in ink tokens so colour never carries meaning alone, hover
   tooltips everywhere, and a table view of every figure in the data tab. */
const AX = { min: 1, max: 5 };

function yGrid(x0, x1, y, label) {
  return `<g><line x1="${x0}" y1="${y}" x2="${x1}" y2="${y}" stroke="var(--grid)" stroke-width="1"/>
    <text x="${x0 - 8}" y="${y + 3.5}" font-size="10" fill="var(--ink-3)" text-anchor="end">${label}</text></g>`;
}

/* V1 · dimension profile — mean score per dimension across the sample */
function chartDims(rows) {
  if (!rows.length) return emptyFig('No dimension data yet.');
  const W = 640, L = 148, R = 54, T = 10, rowH = 30, barH = 14;
  const H = T + DIMS.length * rowH + 26;
  const x = v => L + ((v - AX.min) / (AX.max - AX.min)) * (W - L - R);
  const vgrid = [1, 2, 3, 4, 5].map(v =>
    `<line x1="${x(v)}" y1="${T}" x2="${x(v)}" y2="${T + DIMS.length * rowH - 8}" stroke="var(--grid)" stroke-width="1"/>
     <text x="${x(v)}" y="${H - 8}" font-size="10" fill="var(--ink-3)" text-anchor="middle">${v}</text>`).join('');
  const bars = DIMS.map((d, i) => {
    const a = mean(rows.map(r => r.simDims[d.id]).filter(v => v != null));
    const top = T + i * rowH + 4;
    const bar = a == null ? '' :
      `<rect x="${x(AX.min)}" y="${top}" width="${Math.max(1, x(a) - x(AX.min))}" height="${barH}" rx="3"
         fill="var(--a)" data-tip="<b>${esc(d.name)}</b><br>Mean ${r2(a)} / 5${a == null ? '' : ' · ' + r0(pct100(a)) + '/100'}"/>
       <text x="${x(a) + 7}" y="${top + barH - 3}" font-size="10.5" fill="var(--ink)">${r2(a)}</text>`;
    return `<g>
      <text x="${L - 10}" y="${top + 10}" font-size="10.5" fill="var(--ink)" text-anchor="end">${d.k} · ${esc(d.name)}</text>
      ${bar}
    </g>`;
  }).join('');
  return `<figure>
    <svg class="viz" viewBox="0 0 ${W} ${H}" role="img"
      aria-label="Mean score per engagement dimension across the sample">
      ${vgrid}${bars}
      <line x1="${x(AX.min)}" y1="${T}" x2="${x(AX.min)}" y2="${T + DIMS.length * rowH - 8}" stroke="var(--rule-2)" stroke-width="1"/>
    </svg></figure>`;
}

/* V2 · cost of measurement — minutes on task and data captured */
function chartCost(rows) {
  const any = rows.some(r => r.simSecs);
  if (!any) return emptyFig('No timing data yet.');
  const W = 640, L = 96, R = 66, T = 10, rowH = 30, barH = 14;
  const H = T + rows.length * rowH + 26;
  const maxS = Math.max(60, ...rows.map(r => r.simSecs || 0)) * 1.12;
  const x = s => L + (s / maxS) * (W - L - R);
  const ticks = [0, 0.25, 0.5, 0.75, 1].map(f => {
    const s = maxS * f;
    return `<line x1="${x(s)}" y1="${T}" x2="${x(s)}" y2="${T + rows.length * rowH - 8}" stroke="var(--grid)" stroke-width="1"/>
      <text x="${x(s)}" y="${H - 8}" font-size="10" fill="var(--ink-3)" text-anchor="middle">${Math.round(s / 60)}m</text>`;
  }).join('');
  const bars = rows.map((r, i) => {
    const top = T + i * rowH + 4;
    const bar = r.simSecs == null ? '' :
      `<rect x="${L}" y="${top}" width="${Math.max(1, x(r.simSecs) - L)}" height="${barH}" rx="3" fill="var(--a)"
        data-tip="<b>${esc(r.code)}</b><br>${mmss(r.simSecs)} on task<br>${r.points} data points captured"/>
       <text x="${x(r.simSecs) + 7}" y="${top + barH - 3}" font-size="10.5" fill="var(--ink)">${mmss(r.simSecs)}</text>`;
    return `<g>
      <text x="${L - 10}" y="${top + 11}" font-size="11" fill="var(--ink)" text-anchor="end">${esc(r.code)}</text>
      ${bar}
    </g>`;
  }).join('');
  const mA = median(rows.map(r => r.simSecs).filter(Boolean));
  const pA = mean(rows.map(r => r.points));
  return `<figure>
    <svg class="viz" viewBox="0 0 ${W} ${H}" role="img" aria-label="Time on task per respondent">
      ${ticks}${bars}
      <line x1="${L}" y1="${T}" x2="${L}" y2="${T + rows.length * rowH - 8}" stroke="var(--rule-2)" stroke-width="1"/>
    </svg>
    <p class="p-note">Median time on task <span class="mono">${mmss(mA)}</span>,
      mean <span class="mono">${r0(pA)}</span> data points captured per respondent.</p>
  </figure>`;
}

/* V3 · the signal a single annual number would hide */
function chartTrace(row, opt = {}) {
  const tr = (row.trace || []).map((v, i) => ({ v, i })).filter(p => p.v != null);
  if (!tr.length) return emptyFig('No trace recorded.');
  const W = 640, H = opt.compact ? 230 : 260, L = 34, R = 20, T = 18, B = 46;
  const x = i => L + (i / (STATIONS.length - 1)) * (W - L - R);
  const y = v => T + (1 - (v - AX.min) / (AX.max - AX.min)) * (H - T - B);
  const grid = [1, 2, 3, 4, 5].map(v => yGrid(L, W - R, y(v), v.toFixed(0))).join('');
  const line = tr.map((p, k) => `${k ? 'L' : 'M'}${x(p.i).toFixed(1)} ${y(p.v).toFixed(1)}`).join(' ');
  const area = `${line} L${x(tr[tr.length - 1].i).toFixed(1)} ${y(1)} L${x(tr[0].i).toFixed(1)} ${y(1)} Z`;
  const avg = mean(tr.map(p => p.v));
  const dots = tr.map((p, k) => {
    const st = STATIONS[p.i];
    const ans = (row.answers || [])[p.i];
    const chosen = ans ? (st.opts.find(o => o.v === ans.value) || {}).t : '';
    const last = k === tr.length - 1;
    return `<circle cx="${x(p.i)}" cy="${y(p.v)}" r="${last ? 5.5 : 4}" fill="var(--a)" stroke="var(--surface)" stroke-width="2"
      data-tip="<b>${esc(st.t)} · ${esc(DIM[st.dim].name)}</b><br>${esc(chosen)}<br>Scored ${r2(p.v)} / 5${ans && ans.ms ? ' · answered in ' + (ans.ms / 1000).toFixed(1) + 's' : ''}${ans && ans.revisions ? ' · changed ' + ans.revisions + '×' : ''}"/>`;
  }).join('');
  const xlab = STATIONS.map((s, i) => i % 2 === 0
    ? `<text x="${x(i)}" y="${H - B + 18}" font-size="9" fill="var(--ink-3)" text-anchor="middle">${esc(s.t)}</text>` : '').join('');
  return `<figure>
    <svg class="viz" viewBox="0 0 ${W} ${H}" role="img"
      aria-label="Engagement score at each station across the simulated workday">
      ${grid}
      <path d="${area}" fill="var(--a-soft)"/>
      <path d="${line}" fill="none" stroke="var(--a)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${dots}${xlab}
      <text x="${L}" y="${H - 8}" font-size="9.5" fill="var(--ink-3)">station time across one retrospective workday</text>
    </svg>
    <p class="p-note">Within-day range <span class="mono">${r2(Math.min(...tr.map(p => p.v)))}–${r2(Math.max(...tr.map(p => p.v)))}</span>,
      mean <span class="mono">${r2(avg)}</span>. A single annual number would be the flat average of this line.</p>
  </figure>`;
}
const emptyFig = msg => `<div class="empty"><p class="small">${esc(msg)}</p></div>`;

/* ── 18b · SCREEN · INSTRUMENT DESIGN ─────────────────────────────
   The design record: construct, dimensions, the full item bank, the
   scoring model and the limitations. Open during the live demo.      */
function renderMethods() {
  screen = 'methods';
  setRig({ kind: 'plain', label: 'Instrument design', right: '<button class="ghost" id="exitM">Back to the study</button>' });
  paint(`
    <section style="padding:2.5rem 0 1.5rem">
      <p class="eyebrow">Design record</p>
      <h1 style="font-size:clamp(1.8rem,4.4vw,2.5rem); margin-top:.7rem">How this instrument was built</h1>
      <p class="lede" style="margin-top:1rem">Every element of the simulation, the dimension it
      measures, and the arithmetic that turns a choice into a score.</p>
    </section>

    <div class="card pad stack" style="gap:1rem">
      <p class="eyebrow">1 · Construct</p>
      <h3>What we mean by engagement</h3>
      <p>Engagement is defined here as <strong>the investment of the self in a work role</strong> —
      Kahn's (1990) personal engagement, in which people employ and express themselves physically,
      cognitively and emotionally in role performance. Its expression is the vigour, dedication and
      absorption measured by the UWES (Schaufeli et al., 2002); its antecedents are the job resources
      of the JD-R model (Bakker &amp; Demerouti, 2007).</p>
      <p class="small">Kahn's three psychological conditions — meaningfulness, safety and
      availability — are what the five dimensions below are chosen to span. We follow Macey and
      Schneider (2008) in treating engagement as a state, not a trait: it is a property of the
      person-in-a-job, which is precisely why a single annual reading is a weak instrument for it.</p>
    </div>

    <div class="card pad stack" style="gap:.2rem; margin-top:1.25rem">
      <p class="eyebrow">2 · Dimensions</p>
      <h3 style="margin-bottom:.6rem">Five dimensions, and how each is operationalised</h3>
      ${DIMS.map(d => `
        <div style="border-top:1px solid var(--rule); padding:1rem 0">
          <div class="row wrap" style="gap:.6rem; align-items:baseline">
            <span class="dim-k">${d.k}</span>
            <span class="dim-n">${esc(d.name)}</span>
            <span class="tiny mono">${STATIONS.filter(s => s.dim === d.id).length} stations</span>
          </div>
          <p class="small" style="margin-top:.45rem"><strong>Why it belongs:</strong> ${esc(d.why)}</p>
          <p class="small" style="margin-top:.3rem"><strong>How the simulation measures it:</strong> ${esc(d.op)}</p>
          <p class="tiny" style="margin-top:.3rem">${esc(d.theory)}</p>
        </div>`).join('')}
    </div>

    <div class="card pad stack" style="gap:.2rem; margin-top:1.25rem">
      <p class="eyebrow">3 · Item bank</p>
      <h3 style="margin-bottom:.4rem">All ${STATIONS.length} stations, with their scoring ladders</h3>
      <p class="small" style="margin-bottom:.6rem">Open a station to see the four options and the raw
      value each carries. Option order is shuffled per respondent to remove position bias, using a
      seed derived from the run id so a page refresh does not reshuffle mid-study.</p>
      ${STATIONS.map((st, i) => `
        <details class="bank">
          <summary>
            <span>${esc(st.t)}</span>
            <span><b>${esc(st.prompt)}</b><br><span class="tiny">${DIM[st.dim].k} ${esc(DIM[st.dim].name)}</span></span>
            <span class="tiny">${String(i + 1).padStart(2, '0')}</span>
          </summary>
          <div class="ladder">
            <p class="small" style="margin-bottom:.4rem; font-style:italic">${esc(st.scene)}</p>
            ${st.opts.map(o => `<div class="rung"><span>raw ${o.v}</span><span>${r2(rescale4to5(o.v))}</span><span>${esc(o.t)}</span></div>`).join('')}
          </div>
        </details>`).join('')}
    </div>

    <div class="card pad stack" style="gap:.7rem; margin-top:1.25rem">
      <p class="eyebrow">4 · Scoring model</p>
      <h3>Turning choices into an engagement index</h3>
      <ol class="small" style="margin:.3rem 0 0; padding-left:1.2rem; display:flex; flex-direction:column; gap:.5rem">
        <li>Each station option carries a raw value of 4, 3, 2 or 1, ordered from full presence of the
        condition to its active absence.</li>
        <li>Raw values are linearly rescaled onto a five-point metric:
        <span class="mono">s = 1 + (raw − 1) × 4/3</span>, giving
        <span class="mono">${[1,2,3,4].map(v => r2(rescale4to5(v))).join(' · ')}</span>.</li>
        <li>A dimension score is the unweighted mean of its stations.</li>
        <li>The <strong>engagement index</strong> is the unweighted mean of the five dimension scores,
        so each dimension counts equally. Reported on 1–5 and rescaled to 0–100 as
        <span class="mono">(s − 1) / 4 × 100</span>.</li>
        <li>Bands follow Gallup Q12 convention: <span class="mono">≥ 4.00</span> engaged,
        <span class="mono">3.00–3.99</span> not engaged, <span class="mono">&lt; 3.00</span> actively
        disengaged.</li>
      </ol>
      <p class="p-note">Interaction signals — per-station response latency, the number of times an
      answer was changed, and the within-day trace — are recorded but deliberately excluded from the
      index. They are diagnostic, not construct-valid.</p>
    </div>

    <div class="card pad stack" style="gap:.7rem; margin-top:1.25rem">
      <p class="eyebrow">5 · Administration</p>
      <h3>How a session is run</h3>
      <p class="small">The simulation is retrospective by construction: every stem names the previous
      employer, and the framing is repeated at the landing page, the intake screen and the simulation
      briefing.</p>
      <p class="small">For three respondents the intended procedure is a briefed sitting on the
      group's own device: consent, then the simulation end to end, in one session of about ten
      minutes. Each completed run then appears in the researcher view immediately. Where a respondent
      completes the study on their own device instead, the closing screen issues a result code
      containing their full anonymised record, which the group pastes into
      <em>Researcher view → Data &amp; export → Add a respondent</em>.</p>
      <p class="p-note">Respondents are identified only as R1–R3 with their programme and
      work-history metadata. No name, email or employer name is collected at any point.</p>
    </div>

    <div class="card pad stack" style="gap:.7rem; margin-top:1.25rem">
      <p class="eyebrow">6 · Limitations and ethics</p>
      <h3>What this instrument cannot claim</h3>
      <ul class="small" style="margin:.2rem 0 0; padding-left:1.2rem; display:flex; flex-direction:column; gap:.45rem">
        <li><strong>Three observations.</strong> No reliability or validity coefficient is estimable
        at this n. Comparisons shown in the researcher view are descriptive only.</li>
        <li><strong>Retrospective recall.</strong> The simulation asks about a job the respondent has
        already left, so it is exposed to recall decay and to post-hoc rationalisation of the decision
        to leave.</li>
        <li><strong>Self-report bias.</strong> A single self-report instrument collected in one
        sitting is still subject to social desirability and common method effects (Podsakoff et al.,
        2003), even without a second instrument to inflate convergence with.</li>
        <li><strong>Social desirability.</strong> Scenario options that describe silence or
        disengagement may be under-selected even though nothing is scored as good or bad.</li>
        <li><strong>Surveillance risk.</strong> The case for real-time measurement is also the case
        against it. Latency and revision signals are exactly the data that becomes coercive if
        attached to an identified employee inside a live employment relationship. In this study they
        are anonymised, retrospective, and collected with explicit consent; in an organisational
        deployment they would need a stated retention period, aggregation floors below which no team
        is reported, and a real right to decline that carries no career cost.</li>
      </ul>
    </div>

    <div class="card pad stack" style="gap:.5rem; margin-top:1.25rem">
      <p class="eyebrow">7 · References</p>
      <div class="stack" style="gap:.6rem; margin-top:.3rem">
        ${REFS.map(r => `<p class="small" style="padding-left:1.6rem; text-indent:-1.6rem">${r}</p>`).join('')}
      </div>
    </div>

    <div class="btn-row" style="margin-top:1.75rem">
      <button class="btn btn-2" id="backM">Back to the study</button>
      <a class="tiny" href="#/analysis">Researcher view →</a>
    </div>
  `);
  const back = () => { location.hash = ''; boot(); };
  document.getElementById('backM').onclick = back;
  const ex = document.getElementById('exitM');
  if (ex) ex.onclick = back;
}

/* ── 19 · RESEARCHER VIEW ──────────────────────────────────────────  */
const AV = { tab: 'results', pilots: false, dimSel: 'all', traceSel: null };
let dbRuns = [], dbUnsub = null;

function allRuns() {
  const byId = new Map();
  localRuns().forEach(r => byId.set(r.id, r));
  dbRuns.forEach(r => byId.set(r.id, r));        /* the store wins on conflict */
  return [...byId.values()]
    .filter(r => r && r.a && r.completedAt)
    .sort((a, b) => String(a.code).localeCompare(String(b.code)) || String(a.completedAt).localeCompare(String(b.completedAt)));
}
function activeRows() {
  return allRuns().map(rowFromRun).filter(r => AV.pilots || !r.testRun);
}
function watchDb() {
  if (!DB || dbUnsub) return;
  try {
    dbUnsub = DB.collection('runs').limit(200).onSnapshot(
      snap => { dbRuns = snap.docs.map(d => d.data()).filter(Boolean); if (screen === 'analysis') renderAnalysis(); },
      () => { dbUnsub = null; }
    );
  } catch (e) { dbUnsub = null; }
}

function renderAnalysis() {
  screen = 'analysis';
  setRig({ kind: 'plain', label: 'Researcher view', right: '<button class="ghost" id="exitAn">Respondent view</button>' });
  if (!store.get(K_GATE, false)) return renderGate();
  watchDb();
  const rows = activeRows(), all = allRuns().map(rowFromRun);
  const pilotN = all.filter(r => r.testRun).length;
  paint(`
    <section style="padding:2.25rem 0 1.25rem">
      <p class="eyebrow">Researcher view</p>
      <h2 style="margin-top:.5rem">What the simulation found</h2>
      <p class="small" style="margin-top:.7rem; max-width:62ch">

        sits on a 1–5 metric built from the five dimensions, equally weighted.

      <div class="row wrap" style="gap:.9rem; margin-top:1rem">

        ${pilotN ? `<label class="check tiny" style="align-items:center"><input type="checkbox" id="pilots" ${AV.pilots ? 'checked' : ''}><span>include ${pilotN} pilot run${pilotN === 1 ? '' : 's'}</span></label>` : ''}
      </div>
    </section>

    <div class="tabs" role="tablist">
      ${[['results', 'Results'], ['data', 'Data & export'], ['qual', 'Qualitative']].map(([k, l]) =>
        `<button class="tab" role="tab" data-tab="${k}" aria-selected="${AV.tab === k}">${l}</button>`).join('')}
    </div>
    <div id="tabBody"></div>
  `, true);
  document.getElementById('dbSlot2').appendChild(dbBadgeEl());
  const ex = document.getElementById('exitAn');
  if (ex) ex.onclick = () => { location.hash = ''; boot(); };
  const pl = document.getElementById('pilots');

  wireTab(rows);
  bindTips(stage);
}

/* ── 20 · TAB · RESULTS ────────────────────────────────────────────  */
function tabResults(rows) {
  if (!rows.length) return `

      <h3 style="margin-bottom:.5rem">No responses yet</h3>
      <p class="small" style="max-width:44ch; margin:0 auto">Send the study link to your three
